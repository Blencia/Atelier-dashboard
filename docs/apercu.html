async function openSettings() {
  const t = store.data.theme;
  const l = store.data.layout;
  const s = store.data.search;
  const body = el('div');

  const save = () => store.save();

  /* — Apparence — */
  body.append(el('p', { class: 'section-label', text: 'Apparence' }));

  body.append(await renderFields([
    { key: 'mode', label: 'Thème', type: 'select', options: [['dark', 'Encre'], ['light', 'Papier']] },
    { key: 'density', label: 'Densité', type: 'select', options: [['comfy', 'Confortable'], ['compact', 'Compacte']] },
    { key: 'radius', label: 'Arrondi des coins', type: 'range', min: 0, max: 18 },
    { key: 'showGrid', label: 'Papier millimétré visible', type: 'boolean' },
    { key: 'showLabels', label: 'Titres sous les tuiles', type: 'boolean' },
  ], t, save));

  const swatches = el('div', { class: 'swatches' });
  const custom = el('input', { type: 'color', value: t.accent });
  const paint = (hex) => {
    t.accent = hex;
    custom.value = hex;
    [...swatches.children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.hex === hex)));
    save();
  };
  for (const hex of ACCENTS) {
    const b = el('button', {
      class: 'swatch', type: 'button', 'data-hex': hex,
      'aria-label': hex, 'aria-pressed': String(t.accent === hex),
      style: { background: hex },
      onclick: () => paint(hex),
    });
    swatches.append(b);
  }
  custom.addEventListener('change', () => paint(custom.value));
  swatches.append(custom);
  body.append(el('div', { class: 'field' }, [el('label', { text: 'Couleur d\'accent' }), swatches]));

  /* — Fond — */
  body.append(el('p', { class: 'section-label', text: 'Fond d\'écran' }));

  const file = el('input', { type: 'file', accept: 'image/*' });
  file.addEventListener('change', async () => {
    const f = file.files?.[0];
    if (!f) return;
    try {
      const dataUrl = await downscale(f, 2560, 0.82);
      await store.setWallpaper(dataUrl);
      toast('Fond d\'écran appliqué');
    } catch {
      toast('Image illisible');
    }
  });
  body.append(el('div', { class: 'field' }, [el('label', { text: 'Image' }), file]));

  body.append(await renderFields([
    { key: 'wallpaperDim', label: 'Assombrissement', type: 'range', min: 0, max: 95 },
  ], t, save));

  if (store.wallpaper) {
    body.append(el('button', {
      class: 'btn', type: 'button', text: 'Retirer le fond',
      onclick: async () => { await store.setWallpaper(null); toast('Fond retiré'); },
    }));
  }

  /* — Grille — */
  body.append(el('p', { class: 'section-label', text: 'Grille' }));
  body.append(await renderFields([
    { key: 'cols', label: 'Colonnes', type: 'range', min: 4, max: 16 },
    { key: 'gap', label: 'Espacement (px)', type: 'range', min: 4, max: 32, step: 2 },
    { key: 'row', label: 'Hauteur d\'une rangée (px)', type: 'range', min: 80, max: 240, step: 4 },
    { key: 'maxWidth', label: 'Largeur max (px)', type: 'range', min: 900, max: 2400, step: 20 },
  ], l, save));

  /* — Recherche — */
  body.append(el('p', { class: 'section-label', text: 'Recherche' }));
  body.append(await renderFields([
    {
      key: 'engine', label: 'Moteur de repli', type: 'select', options: ENGINES,
      hint: 'Utilisé quand ta recherche ne correspond à aucun favori.',
    },
    {
      key: 'openIn', label: 'Ouvrir les résultats', type: 'select',
      options: [['current', 'Dans cet onglet'], ['new', 'Dans un nouvel onglet']],
    },
  ], s, save));
  body.append(el('p', {
    class: 'field-hint',
    text: 'Préfixes : g: yt: gh: wiki: maps: img: ddg: — ex. « yt: chats » saute direct sur YouTube.',
  }));

  /* — Données — */
  body.append(el('p', { class: 'section-label', text: 'Données' }));
  const bytes = await store.bytesInUse();
  body.append(el('p', {
    class: 'field-hint',
    text: `Stockage local utilisé : ${(bytes / 1024).toFixed(0)} Ko. Tout reste sur cet appareil.`,
  }));

  const importFile = el('input', { type: 'file', accept: 'application/json,.json', style: { display: 'none' } });
  importFile.addEventListener('change', async () => {
    const f = importFile.files?.[0];
    if (!f) return;
    try {
      await store.import(await f.text());
      toast('Configuration importée');
    } catch {
      toast('Fichier invalide');
    }
  });

  body.append(el('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', marginTop: '10px' } }, [
    el('button', { class: 'btn', type: 'button', text: 'Exporter', onclick: exportConfig }),
    el('button', { class: 'btn', type: 'button', text: 'Importer', onclick: () => importFile.click() }),
    el('button', {
      class: 'btn btn-danger', type: 'button', text: 'Tout réinitialiser',
      onclick: async () => {
        if (confirm('Remettre la configuration à zéro ? Les favoris de Chrome ne sont pas touchés.')) {
          await store.reset();
          toast('Configuration réinitialisée');
        }
      },
    }),
    importFile,
  ]));

  openModal({ title: 'Réglages', body });
}

/* ============================================================
   Journal des versions (CHANGELOG.md, embarqué dans l'extension)
   ============================================================ */

/** Parseur minimal, taillé pour le format Keep a Changelog de CHANGELOG.md. */
function parseChangelog(text) {
  const entries = [];
  let entry = null;
  let section = null;

  for (const raw of text.split('\n')) {
    const line = raw.trimEnd();
    const version = /^## \[([^\]]+)\](?:\s*—\s*(.+))?/.exec(line);
    if (version) {
      entry = { version: version[1], date: version[2] || '', sections: [] };
      entries.push(entry);
      section = null;
      continue;
    }
    const heading = /^### (.+)/.exec(line);
    if (heading && entry) {
      section = { label: heading[1].trim(), items: [] };
      entry.sections.push(section);
      continue;
    }
    const item = /^-\s+(.+)/.exec(line);
    if (item && entry) {
      if (!section) { section = { label: '', items: [] }; entry.sections.push(section); }
      section.items.push(item[1].trim());
      continue;
    }
    if (/^\s+\S/.test(raw) && section?.items.length) {
      // suite indentée d'un item sur plusieurs lignes
      section.items[section.items.length - 1] += ' ' + line.trim();
    }
  }
  return entries.filter((e) => e.sections.some((s) => s.items.length));
}

async function openChangelog() {
  const body = el('div');
  body.append(el('p', { class: 'note', text: 'Chargement…' }));
  openModal({ title: 'Journal des versions', body });

  let entries;
  try {
    const res = await fetch(chrome.runtime.getURL('CHANGELOG.md'));
    if (!res.ok) throw new Error('fetch');
    entries = parseChangelog(await res.text());
  } catch {
    clear(body);
    body.append(el('p', { class: 'note', text: 'Journal indisponible.' }));
    return;
  }

  clear(body);
  if (!entries.length) {
    body.append(el('p', { class: 'note', text: 'Aucune entrée pour l\'instant.' }));
    return;
  }
  for (const entry of entries) {
    const label = /^\d/.test(entry.version) ? `v${entry.version}` : entry.version;
    const wrap = el('div', { class: 'changelog-entry' }, [
      el('div', { class: 'changelog-version' }, [
        label,
        entry.date ? el('span', { class: 'changelog-date', text: entry.date }) : null,
      ]),
    ]);
    for (const section of entry.sections) {
      if (!section.items.length) continue;
      wrap.append(el('div', { class: 'changelog-section' }, [
        section.label ? el('p', { class: 'changelog-section-label', text: section.label }) : null,
        el('ul', {}, section.items.map((item) => el('li', { text: item }))),
      ]));
    }
    body.append(wrap);
  }
}

function exportConfig() {
  const blob = new Blob([store.export()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: `atelier-${new Date().toISOString().slice(0, 10)}.json` });
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/** Réduit une image avant stockage : une photo 8 Mo remplit vite le quota. */
function downscale(file, maxW, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        if (scale === 1 && file.size < 900_000) return resolve(reader.result);
        const canvas = el('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ==== js/bmview.js ==== */
/* Navigateur de dossier de favoris réutilisable : tuiles/liste/icônes seules/
   pastilles, sous-dossiers réels (navigation inline) et sous-dossiers créés
   à la main (clic droit → Nouveau sous-dossier — toujours affichés en icône
   compacte façon écran d'accueil de téléphone, quel que soit l'Affichage du
   module, et acceptent un favori déposé directement dessus), glisser vers
   un autre module, alias local, menu clic droit (renommer/détails). Utilisé
   par les modules Dossier et Dossier à onglets — voir js/widgets/folder.js
   et js/widgets/foldertabs.js.

   IMPORTANT — organisation virtuelle : Atelier NE modifie JAMAIS tes vrais
   favoris Chrome (ni leur ordre, ni leur dossier). Le contenu (existence,
   titre, lien) reste toujours lu en direct depuis chrome.bookmarks. Seuls
   l'ORDRE affiché (store.data.folderOrder) et le DOSSIER D'AFFICHAGE
   (store.data.folderOverride, quand tu glisses un favori vers un autre
   module) sont des surcouches locales, stockées à part. Un favori supprimé
   ou renommé dans Chrome se reflète toujours immédiatement ici. */

/* Type de dataTransfer utilisé par TOUT glisser de favori dans Atelier —
   exporté pour que les modules qui n'utilisent pas mountFolderBrowser
   (ex. le module Dossier compact) puissent quand même être une cible de
   dépôt valide, avec le même protocole. */
const DND_TYPE = 'application/x-atelier-bookmark-id';

/* store.setFolderOrder/setFolderOverride sauvegardent en silencieux (pas de
   rebuild global de app.js, et de toute façon folderOrder/folderOverride ne
   font pas partie de la signature qui déclenche ce rebuild) — sans ceci,
   glisser un favori dans UN module ne rafraîchirait pas les autres modules
   qui affichent le même dossier réel. */
const liveBrowsers = new Set();
function refreshAllBrowsers() {
  for (const render of liveBrowsers) render();
}

// Ménage : si un favori/dossier disparaît vraiment de Chrome, son classement
// et sa position locale n'ont plus de sens — un seul listener pour toute
// l'extension (module ES = singleton), pas un par module monté.
chrome.bookmarks.onRemoved.addListener((id) => {
  let changed = false;
  if (store.data.folderOverride[id]) { delete store.data.folderOverride[id]; changed = true; }
  if (store.data.folderOrder[id]) { delete store.data.folderOrder[id]; changed = true; }
  for (const order of Object.values(store.data.folderOrder)) {
    const i = order.indexOf(id);
    if (i !== -1) { order.splice(i, 1); changed = true; }
  }
  if (changed) store.save({ silent: true });
});

/** Identifiant d'un dossier « virtuel » : n'existe pas dans les vrais
    favoris Chrome, purement local à Atelier — un module Dossier sans
    dossier Chrome assigné en fabrique un (voir virtualFolderId ci-dessous),
    pour devenir un simple bac qu'on remplit par glisser-déposer. */
function isVirtualFolder(id) {
  return typeof id === 'string' && id.startsWith('atelier:');
}

/** Id stable et unique d'un dossier virtuel pour un module (et, pour Dossier
    à onglets, un onglet précis). Jamais transmis à l'API chrome.bookmarks —
    seulement utilisé comme clé dans folderOrder/folderOverride. */
function virtualFolderId(widgetId, tabId) {
  return tabId ? `atelier:${widgetId}:${tabId}` : `atelier:${widgetId}`;
}

/** Id d'un sous-dossier créé à la main (clic droit → Nouveau sous-dossier) —
    même préfixe "atelier:" donc déjà traité comme virtuel partout, mais un
    sous-préfixe "vf:" distinct pour le repérer (renommer/supprimer). */
function newVirtualSubfolderId() {
  return `atelier:vf:${Math.random().toString(36).slice(2, 10)}`;
}

function isVirtualSubfolder(id) {
  return typeof id === 'string' && id.startsWith('atelier:vf:');
}

/** À appeler quand un module (ou un de ses onglets) est supprimé pour de bon :
    libère les favoris qui y étaient classés virtuellement, pour qu'ils ne
    deviennent pas invisibles partout dans Atelier (ils restent, eux, intacts
    dans les vrais favoris Chrome — seul leur classement local est perdu ici). */
async function releaseVirtualFolder(prefix) {
  let changed = false;
  for (const [id, target] of Object.entries(store.data.folderOverride)) {
    if (typeof target === 'string' && target.startsWith(prefix)) {
      delete store.data.folderOverride[id];
      changed = true;
    }
  }
  for (const key of Object.keys(store.data.folderOrder)) {
    if (key.startsWith(prefix)) { delete store.data.folderOrder[key]; changed = true; }
  }
  if (changed) await store.save({ silent: true });
  refreshAllBrowsers();
}

/** Classe virtuellement `nodeId` sous `targetFolderId` (jamais un vrai
    chrome.bookmarks.move) et renvoie le nœud Chrome à jour, ou null s'il
    n'existe plus. Partagé par mountFolderBrowser et les modules simples
    (ex. Dossier compact) qui n'ont pas de liste où positionner précisément. */
async function setDisplayFolder(nodeId, targetFolderId) {
  let node;
  try { [node] = await chrome.bookmarks.get(nodeId); } catch { return null; }
  const displayFolder = store.data.folderOverride[nodeId] || node.parentId;
  if (displayFolder !== targetFolderId) {
    await store.setFolderOverride(nodeId, targetFolderId === node.parentId ? null : targetFolderId);
  }
  return node;
}

/** Variante simple de dropInto, pour les modules sans liste déroulée où
    positionner précisément (ex. l'aperçu compact du module Dossier) —
    classe le favori/dossier à la fin de `targetFolderId`. */
async function classifyIntoFolder(nodeId, targetFolderId) {
  const node = await setDisplayFolder(nodeId, targetFolderId);
  if (!node) return false;
  const order = store.data.folderOrder[targetFolderId] || [];
  if (!order.includes(nodeId)) {
    await store.setFolderOrder(targetFolderId, [...order, nodeId]);
  }
  refreshAllBrowsers();
  return true;
}

/** Enfants réellement affichés dans `folderId` : ceux de Chrome, moins ceux
    classés virtuellement ailleurs, plus ceux classés virtuellement ici.
    Pour un dossier virtuel (aucun dossier Chrome derrière), il n'y a pas
    d'enfants réels — seulement ce qui a été classé ici par glisser. Exporté
    pour être réutilisé par les modules qui n'utilisent pas
    mountFolderBrowser (ex. Dossier compact) mais doivent quand même
    afficher un dossier virtuel correctement. */
async function resolveDisplayedChildren(folderId) {
  const overrides = store.data.folderOverride;
  let items = [];
  if (!isVirtualFolder(folderId)) {
    const real = await chrome.bookmarks.getChildren(folderId);
    items = real.filter((c) => !(overrides[c.id] && overrides[c.id] !== folderId));
  }

  const incomingIds = Object.keys(overrides).filter((id) => overrides[id] === folderId);
  for (const id of incomingIds) {
    if (items.some((c) => c.id === id)) continue;
    try {
      const [node] = await chrome.bookmarks.get(id);
      if (node && node.parentId !== folderId) items.push(node);
    } catch { /* favori supprimé entretemps : classement caduc, ignoré */ }
  }

  // Sous-dossiers créés à la main (clic droit → Nouveau sous-dossier) : de
  // simples nœuds locaux, jamais dans chrome.bookmarks.
  for (const [vfId, vf] of Object.entries(store.data.virtualFolders)) {
    if (vf.parent === folderId) items.push({ id: vfId, title: vf.name, parentId: folderId });
  }
  return items;
}

/**
 * @param {HTMLElement} body      conteneur à remplir (vidé et rempli à chaque rendu)
 * @param {object} opts
 * @param {() => Promise<string|null>} opts.resolveRoot  id du dossier racine à afficher
 * @param {object} opts.settings  { view, tile, icon, sort, limit, openIn, showCrumbs }
 * @param {(patch: object) => Promise} [opts.persistSettings]  pour basculer
 *        automatiquement en tri « Ordre du dossier » quand on glisse-dépose
 */
function mountFolderBrowser(body, opts) {
  const { resolveRoot, settings: s, persistSettings } = opts;
  let stack = [];   // navigation interne, remise à zéro par resetStack()
  let alive = true;
  body.classList.add('bm-dnd');
  // Cible courante du dépôt, mise à jour à chaque render() — wireDrop() est
  // câblé UNE SEULE FOIS sur `body` (élément stable) ; le re-câbler à chaque
  // rendu empilerait des écouteurs en double sur le même élément persistant.
  let currentWrap = null;
  let currentTargetFolderId = null;

  async function render() {
    if (!alive) return;
    clear(body);

    const rootId = await resolveRoot();
    if (!rootId) {
      body.append(el('p', { class: 'note', text: 'Aucun dossier choisi. Ouvre les réglages du module.' }));
      currentWrap = null;
      currentTargetFolderId = null;
      return;
    }

    if (s.view === 'app') {
      await renderAppView(rootId);
      return;
    }

    const currentId = stack.length ? stack[stack.length - 1].id : rootId;
    let items;
    try {
      items = await resolveDisplayedChildren(currentId);
    } catch {
      body.append(el('p', { class: 'note', text: 'Lecture du dossier impossible.' }));
      return;
    }

    if (s.showCrumbs && stack.length) {
      const crumbs = el('nav', { class: 'bm-crumbs' });
      crumbs.append(el('button', {
        type: 'button', text: '← racine',
        onclick: () => { stack = []; render(); },
      }));
      stack.forEach((node, i) => {
        crumbs.append(el('span', { text: '/' }));
        crumbs.append(el('button', {
          type: 'button', text: node.title || '(sans nom)',
          onclick: () => { stack = stack.slice(0, i + 1); render(); },
        }));
      });
      body.append(crumbs);
    }

    if (s.sort === 'alpha') {
      items.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'fr'));
      items.sort((a, b) => (!!a.url) - (!!b.url)); // dossiers d'abord, toujours
    } else if (s.sort === 'recent') {
      items.sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0));
      items.sort((a, b) => (!!a.url) - (!!b.url));
    } else {
      // manuel : ordre local (glisser-déposer dans Atelier), jamais écrit dans Chrome
      const order = store.data.folderOrder[currentId];
      if (order?.length) {
        const pos = new Map(order.map((id, i) => [id, i]));
        items.sort((a, b) => {
          const pa = pos.has(a.id) ? pos.get(a.id) : Infinity;
          const pb = pos.has(b.id) ? pos.get(b.id) : Infinity;
          return pa !== pb ? pa - pb : (!!a.url) - (!!b.url);
        });
      } else {
        items.sort((a, b) => (!!a.url) - (!!b.url));
      }
    }
    if (s.limit > 0) items = items.slice(0, s.limit);

    if (!items.length) {
      body.append(el('p', {
        class: 'note',
        text: isVirtualFolder(currentId) && !stack.length
          ? 'Dossier virtuel, vide pour l\'instant — glisse un favori depuis le panneau latéral (mode plan) ou un autre module pour le classer ici.'
          : 'Dossier vide.',
      }));
      currentWrap = body; // pas de tuiles, mais on peut quand même y déposer un favori
      currentTargetFolderId = currentId;
      return;
    }

    const iconsOnly = s.view === 'icons';
    const tiles = s.view === 'tiles' || iconsOnly;
    const badges = s.view === 'badges';
    const wrap = el('div', {
      class: badges ? 'bm-badges' : tiles ? 'bm-tiles' : `bm-list${s.view === 'compact' ? ' is-dense' : ''}`,
    });
    if (tiles) {
      wrap.style.setProperty('--tile', `${s.tile}px`);
      wrap.style.setProperty('--icon', `${s.icon}px`);
    } else if (badges) {
      wrap.style.setProperty('--icon', `${s.icon}px`);
    }

    for (const node of items) {
      wrap.append(node.url ? linkNode(node, tiles, badges, iconsOnly) : folderNode(node, tiles, badges, iconsOnly));
    }
    body.append(wrap);
    currentWrap = wrap;
    currentTargetFolderId = currentId;
  }

  /** Vue « Icône compacte » : aperçu réduit façon écran d'accueil de
      téléphone, tout le contenu vit dans une fenêtre ouverte au clic. */
  async function renderAppView(rootId) {
    let children;
    try {
      children = await resolveDisplayedChildren(rootId);
    } catch {
      body.append(el('p', { class: 'note', text: 'Lecture du dossier impossible.' }));
      currentWrap = null;
      currentTargetFolderId = null;
      return;
    }

    const name = s.label || s.folderPath?.split(' / ').pop() || 'Dossier';
    const preview = el('div', { class: 'folder-preview' });
    children.slice(0, 4).forEach((n) => preview.append(n.url ? appThumb(n) : el('span', { class: 'glyph', text: '📁' })));
    for (let i = children.length; i < 4; i++) preview.append(el('span', { class: 'folder-slot-empty' }));

    body.append(el('button', {
      class: 'folder-open', type: 'button', title: name,
      onclick: () => { if (!isEditing()) openAppModal(rootId, name); },
    }, [preview, el('span', { class: 'folder-name', text: name })]));

    // Pas de tuiles avec data-bm-id ici : nearestSibling ne trouvera rien,
    // un dépôt s'ajoute donc toujours à la fin — comportement voulu.
    currentWrap = body;
    currentTargetFolderId = rootId;
  }

  function appThumb(node) {
    const img = el('img', { src: faviconUrl(node.url, 32), alt: '', loading: 'lazy' });
    img.addEventListener('error', () => {
      img.replaceWith(el('span', { class: 'glyph', text: initial(node.title, node.url) }));
    });
    return img;
  }

  /** Mini aperçu (façon écran d'accueil) d'un sous-dossier fait main, utilisé
      à la place du simple glyphe « ▸ » partout où folderNode l'affiche —
      tuiles, liste, pastilles. Rempli de façon asynchrone (folderNode est
      synchrone) : 4 emplacements vides d'abord, puis remplacés dès que le
      contenu du sous-dossier est connu. */
  function folderPreviewMini(folderId, size) {
    const preview = el('div', { class: 'folder-preview folder-preview-mini' });
    preview.style.setProperty('--fp-size', `${size}px`);
    for (let i = 0; i < 4; i++) preview.append(el('span', { class: 'folder-slot-empty' }));
    resolveDisplayedChildren(folderId).then((children) => {
      clear(preview);
      children.slice(0, 4).forEach((n) => preview.append(n.url ? appThumb(n) : el('span', { class: 'glyph', text: '📁' })));
      for (let i = children.length; i < 4; i++) preview.append(el('span', { class: 'folder-slot-empty' }));
    }).catch(() => {});
    return preview;
  }

  /** Grille plein écran, façon écran d'accueil, avec sa propre navigation
      dans les sous-dossiers — réutilise linkNode/folderNode : même
      glisser-sortant, alias, clic droit que la vue inline. */
  function openAppModal(rootId, title) {
    let modalStack = [];
    let modalCurrentId = rootId;
    const grid = el('div', { class: 'folder-grid' });
    grid.style.setProperty('--icon', `${s.icon}px`);
    const crumbs = el('nav', { class: 'bm-crumbs' });

    grid.addEventListener('contextmenu', (e) => {
      if (e.target !== grid) return; // clic sur un item : son propre menu s'en charge
      e.preventDefault();
      openContextMenu(e.clientX, e.clientY, [
        { label: '+ Nouveau sous-dossier', onClick: () => createSubfolder(modalCurrentId) },
      ]);
    });

    // Dépose un favori glissé (panneau latéral, autre module) directement
    // dans le dossier actuellement ouvert dans cette fenêtre.
    grid.addEventListener('dragover', (e) => {
      if (!isEditing() || !e.dataTransfer.types.includes(DND_TYPE)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      grid.classList.add('bm-drop-target');
    });
    grid.addEventListener('dragleave', (e) => { if (e.target === grid) grid.classList.remove('bm-drop-target'); });
    grid.addEventListener('drop', async (e) => {
      grid.classList.remove('bm-drop-target');
      if (!isEditing()) return;
      const bmId = e.dataTransfer.getData(DND_TYPE);
      if (!bmId) return;
      e.preventDefault();
      const ok = await classifyIntoFolder(bmId, modalCurrentId);
      if (ok) { toast('Classé ici — les vrais favoris Chrome ne sont pas touchés'); draw(); }
      else toast('Déplacement impossible');
    });

    async function draw() {
      clear(grid);
      clear(crumbs);
      modalCurrentId = modalStack.length ? modalStack[modalStack.length - 1].id : rootId;
      let children;
      try { children = await resolveDisplayedChildren(modalCurrentId); } catch { children = []; }

      if (modalStack.length) {
        crumbs.append(el('button', { type: 'button', text: '← racine', onclick: () => { modalStack = []; draw(); } }));
        modalStack.forEach((node, i) => {
          crumbs.append(el('span', { text: '/' }));
          crumbs.append(el('button', {
            type: 'button', text: node.title || '(sans nom)',
            onclick: () => { modalStack = modalStack.slice(0, i + 1); draw(); },
          }));
        });
      }

      for (const node of children) {
        grid.append(node.url
          ? linkNode(node, true, false, false)
          : folderNode(node, true, false, false, (n) => { modalStack.push(n); draw(); }));
      }
      if (!children.length) {
        grid.append(el('p', {
          class: 'note',
          text: isVirtualFolder(modalCurrentId) && !modalStack.length
            ? 'Dossier virtuel, vide pour l\'instant — glisse un favori depuis le panneau latéral (mode plan) ou un autre module pour le classer ici.'
            : 'Dossier vide.',
        }));
      }
    }

    draw();
    openModal({ title, body: el('div', {}, [crumbs, grid]) });
  }

  /** Le voisin le plus proche du pointeur, et si on dépose avant ou après lui. */
  function nearestSibling(wrap, x, y) {
    const nodes = [...wrap.children].filter((n) => n.dataset.bmId && !n.classList.contains('dragging-bm'));
    let best = null;
    let bestDist = Infinity;
    for (const n of nodes) {
      const r = n.getBoundingClientRect();
      const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
      if (d < bestDist) { bestDist = d; best = n; }
    }
    if (!best) return { el: null, before: false };
    const r = best.getBoundingClientRect();
    const sameRow = Math.abs(y - (r.top + r.height / 2)) < r.height / 2;
    const before = sameRow ? x < r.left + r.width / 2 : y < r.top + r.height / 2;
    return { el: best, before };
  }

  /** Classe virtuellement `bmId` dans `targetFolderId`, à la position visuelle
      demandée — jamais un chrome.bookmarks.move. Le vrai favori ne bouge pas. */
  async function dropInto(wrap, targetFolderId, bmId, refId, before) {
    const node = await setDisplayFolder(bmId, targetFolderId);
    if (!node) return false;

    // Ordre local : la séquence actuellement affichée dans ce module, avec
    // bmId inséré au bon endroit.
    const currentIds = [...wrap.children].map((n) => n.dataset.bmId).filter((id) => id && id !== bmId);
    let insertAt = currentIds.length;
    if (refId) {
      const idx = currentIds.indexOf(refId);
      if (idx !== -1) insertAt = before ? idx : idx + 1;
    }
    currentIds.splice(insertAt, 0, bmId);
    await store.setFolderOrder(targetFolderId, currentIds);

    // Le dépôt ne se voit que si ce module est trié « Ordre du dossier » —
    // on y bascule automatiquement, sinon le glisser semblerait ne rien faire.
    if (s.sort !== 'manual' && persistSettings) {
      s.sort = 'manual';
      await persistSettings({ sort: 'manual' });
    }
    return true;
  }

  /** Câblé UNE SEULE FOIS sur `body` (élément stable pendant toute la vie du
      module) — lit `currentWrap`/`currentTargetFolderId`, mis à jour par
      chaque render(), plutôt que d'être re-câblé (et donc dupliqué) à
      chaque rendu. `body` reçoit les écouteurs pour couvrir tout le module,
      pas juste la grille de tuiles. */
  function wireDrop() {
    let marked = null;
    const unmark = () => { marked?.classList.remove('bm-insert-target'); marked = null; };

    body.addEventListener('dragover', (e) => {
      if (!isEditing() || !currentTargetFolderId || !e.dataTransfer.types.includes(DND_TYPE)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      body.classList.add('bm-drop-target');
      const { el: near } = nearestSibling(currentWrap, e.clientX, e.clientY);
      if (near !== marked) { unmark(); if (near) { near.classList.add('bm-insert-target'); marked = near; } }
    });
    body.addEventListener('dragleave', (e) => {
      if (e.target === body) { body.classList.remove('bm-drop-target'); unmark(); }
    });
    body.addEventListener('drop', async (e) => {
      body.classList.remove('bm-drop-target');
      const { el: near, before } = nearestSibling(currentWrap, e.clientX, e.clientY);
      unmark();
      if (!isEditing() || !currentTargetFolderId) return;
      const bmId = e.dataTransfer.getData(DND_TYPE);
      if (!bmId) return;
      e.preventDefault();

      const ok = await dropInto(currentWrap, currentTargetFolderId, bmId, near?.dataset.bmId, before);
      if (ok) {
        toast('Classé ici — les vrais favoris Chrome ne sont pas touchés');
        refreshAllBrowsers();
      } else {
        toast('Déplacement impossible');
      }
    });
  }

  /** Câblé une seule fois sur `body`, comme wireDrop() — clic droit sur
      l'espace vide (pas sur un item, qui a déjà son propre menu) propose
      de créer un sous-dossier virtuel, façon écran d'accueil de téléphone. */
  function wireContextMenu() {
    body.addEventListener('contextmenu', (e) => {
      if (!currentTargetFolderId) return;
      const onEmptySpace = e.target === currentWrap || (currentWrap === body && e.target === body);
      if (!onEmptySpace) return;
      e.preventDefault();
      openContextMenu(e.clientX, e.clientY, [
        { label: '+ Nouveau sous-dossier', onClick: () => createSubfolder(currentTargetFolderId) },
      ]);
    });
  }

  function iconFor(node, size) {
    if (!node.url) return el('span', { class: 'glyph', text: '▸' });
    const img = el('img', {
      src: faviconUrl(node.url, size ? Math.max(32, s.icon * 2) : 32),
      alt: '', loading: 'lazy',
    });
    img.addEventListener('error', () => {
      img.replaceWith(el('span', { class: 'glyph', text: initial(node.title, node.url) }));
    });
    return img;
  }

  /** Renomme localement un favori (alias) ou un sous-dossier virtuel (son
      seul nom) — n'écrit jamais dans les vrais favoris Chrome. */
  function renameNode(node) {
    const virtualSub = isVirtualSubfolder(node.id);
    const current = virtualSub ? node.title : (store.data.aliases[node.id] || '');
    const input = el('input', { type: 'text', value: current, placeholder: node.title || hostOf(node.url) });
    const body2 = el('div', { class: 'field' }, [
      el('label', { text: virtualSub ? 'Nom du sous-dossier' : 'Nom affiché (local à Atelier, le favori n\'est pas modifié)' }), input,
    ]);
    const commit = async (value) => {
      if (virtualSub) await store.renameVirtualFolder(node.id, value || 'Sans nom');
      else await store.setAlias(node.id, value);
      close();
      refreshAllBrowsers();
      toast('Nom mis à jour');
    };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') commit(input.value); });
    const footer = el('div', { style: { display: 'flex', gap: '8px', width: '100%' } }, [
      !virtualSub && current ? el('button', { class: 'btn', type: 'button', text: 'Réinitialiser', onclick: () => commit('') }) : null,
      el('span', { style: { flex: '1' } }),
      el('button', { class: 'btn btn-primary', type: 'button', text: 'Enregistrer', onclick: () => commit(input.value) }),
    ]);
    const close = openModal({ title: virtualSub ? 'Renommer ce sous-dossier' : 'Renommer ce favori', body: body2, footer });
  }

  /** Retire un favori/dossier de son classement virtuel — il redevient
      affiché sous son vrai dossier Chrome. */
  async function unclassify(node) {
    await store.setFolderOverride(node.id, null);
    refreshAllBrowsers();
    toast('Remis à sa place réelle dans Chrome');
  }

  /** Supprime un sous-dossier créé à la main. Les favoris qui y étaient
      classés sont libérés (pas perdus) plutôt que de devenir invisibles. */
  async function deleteSubfolder(node) {
    if (!confirm(`Supprimer le sous-dossier « ${node.title} » ? Son contenu ne sera pas supprimé, seulement libéré.`)) return;
    await releaseVirtualFolder(node.id);
    await store.removeVirtualFolder(node.id);
    refreshAllBrowsers();
    toast('Sous-dossier supprimé');
  }

  /** Clic droit sur un espace vide : proposer de créer un sous-dossier
      virtuel ici, façon écran d'accueil de téléphone. */
  function createSubfolder(parentId) {
    const input = el('input', { type: 'text', placeholder: 'Ex. Clients', value: 'Nouveau dossier' });
    const body2 = el('div', { class: 'field' }, [el('label', { text: 'Nom du sous-dossier' }), input]);
    const create = async () => {
      await store.setVirtualFolder(newVirtualSubfolderId(), input.value, parentId);
      close();
      refreshAllBrowsers();
      toast('Sous-dossier créé');
    };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') create(); });
    const footer = el('div', { style: { display: 'flex', justifyContent: 'flex-end', width: '100%' } }, [
      el('button', { class: 'btn btn-primary', type: 'button', text: 'Créer', onclick: create }),
    ]);
    const close = openModal({ title: 'Nouveau sous-dossier', body: body2, footer });
  }

  /** Fiche détaillée : titre réel, lien complet, date d'ajout, copier le lien. */
  function showDetails(node) {
    const alias = store.data.aliases[node.id];
    const rows = [
      ['Titre', node.title || '(sans titre)'],
      alias ? ['Nom affiché (local)', alias] : null,
      node.url ? ['Lien', node.url] : null,
      [
        'Ajouté le',
        node.dateAdded
          ? new Intl.DateTimeFormat('fr-CA', { dateStyle: 'long', timeStyle: 'short' }).format(new Date(node.dateAdded))
          : '—',
      ],
    ].filter(Boolean);

    const body2 = el('div', { class: 'bm-details' });
    for (const [label, value] of rows) {
      body2.append(el('div', { class: 'bm-details-row' }, [
        el('span', { class: 'bm-details-label', text: label }),
        el('span', { class: 'bm-details-value', text: value }),
      ]));
    }

    const footer = node.url ? el('div', { style: { display: 'flex', gap: '8px', width: '100%' } }, [
      el('button', {
        class: 'btn', type: 'button', text: 'Copier le lien',
        onclick: async () => {
          try { await navigator.clipboard.writeText(node.url); toast('Lien copié'); }
          catch { toast('Copie impossible'); }
        },
      }),
      el('span', { style: { flex: '1' } }),
      el('a', { class: 'btn btn-primary', href: node.url, target: '_blank', rel: 'noopener', text: 'Ouvrir le lien' }),
    ]) : null;

    openModal({ title: node.url ? 'Détails du favori' : 'Détails du dossier', body: body2, footer });
  }

  function contextItems(node) {
    const virtualSub = isVirtualSubfolder(node.id);
    const items = [
      { label: 'Renommer' + (node.url ? ' le favori' : ' le dossier') + ' (local)', onClick: () => renameNode(node) },
      { label: 'Voir les détails', onClick: () => showDetails(node) },
    ];
    if (store.data.folderOverride[node.id]) {
      items.push('-', { label: '↩ Remettre à sa place réelle', onClick: () => unclassify(node) });
    }
    if (virtualSub) {
      items.push('-', { label: '🗑 Supprimer ce sous-dossier', onClick: () => deleteSubfolder(node) });
    }
    return items;
  }

  function linkNode(node, tiles, badges, iconsOnly) {
    // textContent partout : un titre de favori peut contenir du HTML.
    const alias = store.data.aliases[node.id];
    const label = alias || node.title || hostOf(node.url);
    const virtual = !!store.data.folderOverride[node.id];
    const a = el('a', {
      class: `${badges ? 'badge' : tiles ? 'tile' : 'row'}${iconsOnly ? ' is-icon-only' : ''}${virtual ? ' bm-virtual' : ''}`,
      href: node.url,
      title: `${label}\n${node.url}${virtual ? '\n(classé ici dans Atelier seulement)' : ''}`,
      'data-bm-id': node.id,
      draggable: 'true', // el() ne stringifie que `true` littéral en "" — 'draggable' exige la chaîne "true"
      onclick: (e) => { if (isEditing()) return e.preventDefault(); openLink(node.url, s.openIn, e); },
      onauxclick: (e) => { if (isEditing()) return e.preventDefault(); openLink(node.url, s.openIn, e); },
      oncontextmenu: (e) => { e.preventDefault(); openContextMenu(e.clientX, e.clientY, contextItems(node)); },
      ondragstart: (e) => {
        if (!isEditing()) return e.preventDefault();
        // stopPropagation : sans ça, ce dragstart remonte jusqu'à l'article
        // .widget et déclenche AUSSI le déplacement du module entier (app.js).
        e.stopPropagation();
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData(DND_TYPE, node.id);
        a.classList.add('dragging-bm');
      },
      ondragend: (e) => { e.stopPropagation(); a.classList.remove('dragging-bm'); },
    });
    a.append(iconFor(node, tiles || badges));
    if (!badges && !iconsOnly) {
      a.append(el('span', { class: 'label', text: label }));
      a.append(el('button', {
        class: 'bm-rename', type: 'button', title: 'Renommer (local)', text: '✎',
        onclick: (e) => { e.preventDefault(); e.stopPropagation(); renameNode(node); },
      }));
    }
    if (!tiles && !badges) a.append(el('span', { class: 'host', text: hostOf(node.url) }));
    return a;
  }

  /** Un sous-dossier fait main (clic droit → Nouveau sous-dossier) s'affiche
      toujours en icône compacte façon écran d'accueil de téléphone — aperçu
      de son contenu, clic = fenêtre — quel que soit l'Affichage du module
      qui le contient. `onOpen` : navigation par défaut d'un VRAI sous-dossier
      Chrome, dans la liste inline (stack/render) ; la modale du mode « Icône
      compacte » passe sa propre navigation pour ceux-là. */
  function folderNode(node, tiles, badges, iconsOnly, onOpen) {
    const virtualSub = isVirtualSubfolder(node.id);
    const nav = virtualSub ? () => openAppModal(node.id, node.title) : (onOpen || ((n) => { stack.push(n); render(); }));
    const virtual = !!store.data.folderOverride[node.id];
    const b = el('button', {
      class: `${badges ? 'badge' : tiles ? 'tile' : 'row'}${iconsOnly ? ' is-icon-only' : ''}${virtual ? ' bm-virtual' : ''}`,
      type: 'button',
      title: virtual ? `${node.title}\n(classé ici dans Atelier seulement)` : node.title,
      style: { background: 'none', border: 0, cursor: 'pointer', font: 'inherit', width: '100%' },
      'data-bm-id': node.id,
      draggable: 'true',
      onclick: () => { if (isEditing()) return; nav(node); },
      oncontextmenu: (e) => { e.preventDefault(); openContextMenu(e.clientX, e.clientY, contextItems(node)); },
      ondragstart: (e) => {
        if (!isEditing()) return e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData(DND_TYPE, node.id);
        b.classList.add('dragging-bm');
      },
      ondragend: (e) => { e.stopPropagation(); b.classList.remove('dragging-bm'); },
    });
    if (virtualSub) {
      b.append(folderPreviewMini(node.id, badges ? s.icon : tiles ? s.icon : 20));
      // Reçoit aussi un favori déposé directement sur son icône, sans avoir à
      // l'ouvrir — stopPropagation pour ne pas laisser wireDrop() (câblé sur
      // `body`) le traiter en plus comme un simple réordonnancement.
      b.addEventListener('dragover', (e) => {
        if (!isEditing() || !e.dataTransfer.types.includes(DND_TYPE)) return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        b.classList.add('bm-insert-target');
      });
      b.addEventListener('dragleave', () => b.classList.remove('bm-insert-target'));
      b.addEventListener('drop', async (e) => {
        b.classList.remove('bm-insert-target');
        if (!isEditing()) return;
        const bmId = e.dataTransfer.getData(DND_TYPE);
        if (!bmId || bmId === node.id) return;
        e.preventDefault();
        e.stopPropagation();
        const ok = await classifyIntoFolder(bmId, node.id);
        toast(ok ? 'Classé dans ce sous-dossier — les vrais favoris Chrome ne sont pas touchés' : 'Déplacement impossible');
      });
    } else {
      b.append(el('span', { class: 'glyph', text: '▸' }));
    }
    if (!badges && !iconsOnly) b.append(el('span', { class: 'label', text: node.title || '(sans nom)' }));
    return b;
  }

  const refresh = () => render();
  chrome.bookmarks.onCreated.addListener(refresh);
  chrome.bookmarks.onRemoved.addListener(refresh);
  chrome.bookmarks.onChanged.addListener(refresh);
  chrome.bookmarks.onMoved.addListener(refresh);
  liveBrowsers.add(render);

  wireDrop();
  wireContextMenu();
  render();

  return {
    render,
    resetStack() { stack = []; },
    stop() {
      alive = false;
      liveBrowsers.delete(render);
      chrome.bookmarks.onCreated.removeListener(refresh);
      chrome.bookmarks.onRemoved.removeListener(refresh);
      chrome.bookmarks.onChanged.removeListener(refresh);
      chrome.bookmarks.onMoved.removeListener(refresh);
    },
  };
}

/* ==== js/sidepanel.js ==== */
/* Panneau latéral, visible seulement en mode plan : liste tous les favoris
   pour qu'on puisse en glisser un directement vers un module Dossier de
   favoris / Dossier à onglets / Dossier — même protocole de glisser
   (DND_TYPE) que les modules eux-mêmes, aucune logique de dépôt en plus à
   écrire ici. */

let all = [];
let panel, list, searchInput;
let listening = false;

/** La cartouche est `position: sticky`, pas fixe — son décalage top:0 en dur
    la faisait passer SOUS elle. On mesure sa hauteur réelle (qui varie si
    elle retombe sur 2 lignes) plutôt que de deviner une valeur. */
function syncTop() {
  if (!panel) return;
  const titleblock = document.getElementById('titleblock');
  panel.style.top = `${titleblock ? titleblock.getBoundingClientRect().bottom : 0}px`;
}
window.addEventListener('resize', debounce(syncTop, 100));

function row(bm) {
  const label = bm.title || hostOf(bm.url);
  const r = el('div', {
    class: 'sp-row',
    title: `${label}\n${bm.url}${bm.path ? `\n${bm.path}` : ''}`,
    draggable: 'true',
    ondragstart: (e) => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData(DND_TYPE, bm.id);
      r.classList.add('dragging-bm');
    },
    ondragend: () => r.classList.remove('dragging-bm'),
  });
  const img = el('img', { src: faviconUrl(bm.url, 28), alt: '', loading: 'lazy' });
  img.addEventListener('error', () => {
    img.replaceWith(el('span', { class: 'glyph', text: initial(bm.title, bm.url) }));
  });
  r.append(img, el('div', { class: 'sp-row-text' }, [
    el('span', { class: 'sp-row-title', text: label }),
    el('span', { class: 'sp-row-path', text: bm.path || '—' }),
  ]));
  return r;
}

function renderList() {
  const q = searchInput.value.trim().toLowerCase();
  clear(list);
  const filtered = q
    ? all.filter((bm) => `${bm.title} ${bm.url} ${bm.path}`.toLowerCase().includes(q))
    : all;
  if (!filtered.length) {
    list.append(el('p', { class: 'note', text: 'Aucun favori.' }));
    return;
  }
  for (const bm of filtered) list.append(row(bm));
}

async function refresh() {
  try { all = await listAllBookmarks(); } catch { all = []; }
  renderList();
}

function ensurePanel() {
  if (panel) return;
  searchInput = el('input', { type: 'text', placeholder: 'Filtrer les favoris…', class: 'sp-search' });
  searchInput.addEventListener('input', debounce(renderList, 80));
  list = el('div', { class: 'sp-list' });
  panel = el('aside', { class: 'side-panel', id: 'sidePanel' }, [
    el('div', { class: 'sp-head' }, [
      el('span', { class: 'sp-title', text: 'Tous les favoris' }),
      el('span', { class: 'sp-hint', text: 'Glisse vers un module dossier' }),
    ]),
    searchInput,
    list,
  ]);
  document.body.append(panel);
}

function showSidePanel() {
  ensurePanel();
  syncTop();
  panel.hidden = false;
  if (!listening) {
    listening = true;
    for (const ev of ['onCreated', 'onRemoved', 'onChanged', 'onMoved']) {
      chrome.bookmarks[ev].addListener(refresh);
    }
  }
  refresh();
}

function hideSidePanel() {
  if (!panel) return;
  panel.hidden = true;
  if (listening) {
    listening = false;
    for (const ev of ['onCreated', 'onRemoved', 'onChanged', 'onMoved']) {
      chrome.bookmarks[ev].removeListener(refresh);
    }
  }
}

/* ==== js/widgets/folder.js ==== */
/* Widget unique pour un dossier de favoris (réel ou virtuel) : Tuiles /
   Icônes seules / Liste / Liste dense / Pastilles, toujours affiché sur la
   feuille. Peut rester entièrement virtuel — laisse le dossier vide et
   remplis-le à la main par glisser-déposer (panneau latéral ou clic droit
   → nouveau sous-dossier, voir bmview.js). Un sous-dossier créé ainsi
   s'affiche toujours en icône compacte façon écran d'accueil de téléphone,
   qui s'ouvre en fenêtre au clic — ce n'est plus un réglage du widget
   lui-même, seulement le rendu inhérent des sous-dossiers faits main.

   Le type "bookmarks" reste enregistré (caché du sélecteur "Ajouter un
   module", voir hidden ci-dessous) uniquement pour que les modules créés
   avant la fusion des deux anciens widgets continuent de fonctionner tels
   quels, sans migration de données. Un widget déjà réglé sur l'ancienne vue
   "app" (Icône compacte, retirée du sélecteur) continue aussi de fonctionner
   telle quelle — voir le rendu `s.view === 'app'` dans bmview.js. */

const shared = {
  name: 'Dossier',
  category: 'principal',
  blurb: 'Un dossier de favoris — tuiles, icônes, liste ou pastilles. Clic droit dedans pour créer des sous-dossiers façon écran d\'accueil de téléphone. Peut rester virtuel, rempli à la main.',
  defaultSize: { w: 4, h: 2 },
  defaults: {
    folderId: null,
    folderPath: '',
    label: '',
    view: 'tiles',
    tile: 76,
    icon: 26,
    limit: 0,
    openIn: 'current',
    sort: 'manual',
    showCrumbs: true,
    wrapped: false,
  },
  fields: [
    {
      key: 'folderId', label: 'Dossier', type: 'folder',
      hint: 'Optionnel — laisse vide pour un dossier virtuel que tu remplis toi-même par glisser-déposer, sans toucher à un vrai dossier Chrome.',
    },
    { key: 'label', label: 'Titre (vide = nom du dossier)', type: 'text' },
    {
      key: 'view', label: 'Affichage', type: 'select', gates: true,
      options: [
        ['tiles', 'Tuiles'], ['icons', 'Icônes seules'], ['list', 'Liste'],
        ['compact', 'Liste dense'], ['badges', 'Pastilles'],
      ],
      hint: 'Les sous-dossiers créés par clic droit s\'affichent toujours en icône compacte, quel que soit ce réglage.',
    },
    { key: 'tile', label: 'Largeur des tuiles', type: 'range', min: 56, max: 140, step: 4, when: (s) => s.view === 'tiles' || s.view === 'icons' },
    {
      key: 'icon', label: 'Taille des icônes', type: 'range', min: 16, max: 44, step: 2,
      when: (s) => s.view === 'tiles' || s.view === 'icons' || s.view === 'badges',
    },
    {
      key: 'sort', label: 'Tri', type: 'select',
      options: [['manual', 'Ordre local (glisser-déposer)'], ['alpha', 'Alphabétique'], ['recent', 'Ajout récent']],
      hint: 'L\'ordre local est propre à Atelier — il ne change jamais l\'ordre réel dans Chrome.',
    },
    { key: 'limit', label: 'Nombre max (0 = tout)', type: 'number', min: 0, max: 200 },
    {
      key: 'openIn', label: 'Ouvrir les liens', type: 'select',
      options: [['current', 'Dans cet onglet'], ['new', 'Dans un nouvel onglet']],
    },
    { key: 'showCrumbs', label: 'Afficher le fil d\'Ariane', type: 'boolean' },
    {
      key: 'wrapped', label: 'Design wrappé (contour collé aux pastilles)', type: 'boolean',
      when: (s) => s.view === 'badges',
      hint: 'Réduit la marge du module au minimum pour qu\'il prenne le moins de place possible autour des pastilles.',
    },
  ],

  title(w) {
    return w.settings.label || w.settings.folderPath?.split(' / ').pop() || 'Dossier';
  },

  mount(body, ctx) {
    const s = ctx.settings;
    body.classList.toggle('is-wrapped', s.view === 'badges' && !!s.wrapped);

    async function resolveRoot() {
      if (s.folderId) {
        try {
          const [node] = await chrome.bookmarks.get(String(s.folderId));
          if (node) return node.id;
        } catch { /* id mort : on tente le chemin */ }
      }
      if (s.folderPath) {
        const found = await findFolderByPath(s.folderPath);
        if (found) {
          ctx.update({ folderId: found.id });   // auto-réparation après import
          return found.id;
        }
      }
      // Aucun dossier Chrome assigné : ce module devient un dossier virtuel,
      // un simple bac qu'on remplit par glisser-déposer (panneau latéral,
      // un autre module, ou clic droit → nouveau sous-dossier).
      return virtualFolderId(ctx.widget.id);
    }

    const browser = mountFolderBrowser(body, {
      resolveRoot, settings: s,
      persistSettings: (patch) => ctx.update(patch, { silent: true }),
    });
    return () => browser.stop();
  },
};

defineWidget({ ...shared, type: 'folder' });
defineWidget({ ...shared, type: 'bookmarks', hidden: true });

/* ==== js/widgets/misc.js ==== */
/* ---------- Horloge ---------- */

defineWidget({
  type: 'clock',
  name: 'Horloge',
  category: 'autre',
  blurb: 'Heure et date, format québécois.',
  defaultSize: { w: 3, h: 1 },
  defaults: { seconds: false, hour12: false, date: true, label: 'Horloge', tz2: '', tz2Label: '' },
  fields: [
    { key: 'label', label: 'Titre du module', type: 'text' },
    { key: 'hour12', label: 'Format 12 h (AM/PM)', type: 'boolean' },
    { key: 'seconds', label: 'Afficher les secondes', type: 'boolean' },
    { key: 'date', label: 'Afficher la date', type: 'boolean' },
    {
      key: 'tz2', label: 'Second fuseau horaire', type: 'text',
      hint: 'Nom IANA, ex. Europe/Paris ou Asia/Tokyo. Vide = désactivé.',
    },
    { key: 'tz2Label', label: 'Étiquette du second fuseau', type: 'text', when: (s) => !!s.tz2 },
  ],
  title: (w) => w.settings.label || 'Horloge',

  mount(body, ctx) {
    const s = ctx.settings;
    const time = el('div', { class: 'clock-time', text: '--:--' });
    const date = el('div', { class: 'clock-date' });
    const tz2 = el('div', { class: 'clock-tz2' });
    const wrap = el('div', { class: 'clock' }, [time, s.date ? date : null, s.tz2 ? tz2 : null]);
    clear(body);
    body.append(wrap);

    const tf = new Intl.DateTimeFormat('fr-CA', {
      hour: '2-digit', minute: '2-digit',
      second: s.seconds ? '2-digit' : undefined,
      hour12: !!s.hour12,
    });
    const df = new Intl.DateTimeFormat('fr-CA', {
      weekday: 'long', day: 'numeric', month: 'long',
    });
    let tf2 = null;
    if (s.tz2) {
      try {
        tf2 = new Intl.DateTimeFormat('fr-CA', { hour: '2-digit', minute: '2-digit', hour12: !!s.hour12, timeZone: s.tz2 });
      } catch { tf2 = null; }
    }

    const tick = () => {
      const now = new Date();
      time.textContent = tf.format(now);
      if (s.date) date.textContent = df.format(now);
      if (s.tz2) tz2.textContent = tf2 ? `${s.tz2Label || s.tz2} · ${tf2.format(now)}` : 'Fuseau invalide';
    };
    tick();
    const id = setInterval(tick, s.seconds ? 1000 : 15000);
    return () => clearInterval(id);
  },
});

/* ---------- Compte à rebours ---------- */

defineWidget({
  type: 'countdown',
  name: 'Compte à rebours',
  category: 'autre',
  blurb: 'Temps restant jusqu\'à une date : rendez-vous, échéance.',
  defaultSize: { w: 3, h: 1 },
  defaults: { label: 'Compte à rebours', target: '', doneText: 'C\'est aujourd\'hui !' },
  fields: [
    { key: 'label', label: 'Titre du module', type: 'text' },
    { key: 'target', label: 'Date et heure cible', type: 'datetime' },
    { key: 'doneText', label: 'Texte à l\'échéance', type: 'text' },
  ],
  title: (w) => w.settings.label || 'Compte à rebours',

  mount(body, ctx) {
    const s = ctx.settings;
    const big = el('div', { class: 'countdown-big', text: '—' });
    const sub = el('div', { class: 'countdown-sub' });
    clear(body);
    body.append(el('div', { class: 'countdown' }, [big, sub]));

    if (!s.target) {
      sub.textContent = 'Choisis une date dans les réglages du module.';
      return () => {};
    }

    const targetMs = new Date(s.target).getTime();
    const df = new Intl.DateTimeFormat('fr-CA', { dateStyle: 'long', timeStyle: 'short' });

    const tick = () => {
      if (Number.isNaN(targetMs)) { big.textContent = '—'; sub.textContent = 'Date invalide.'; return; }
      const diff = targetMs - Date.now();
      if (diff <= 0) { big.textContent = '🎉'; sub.textContent = s.doneText || 'C\'est aujourd\'hui !'; return; }
      const days = Math.floor(diff / 86_400_000);
      const hours = Math.floor((diff % 86_400_000) / 3_600_000);
      const mins = Math.floor((diff % 3_600_000) / 60_000);
      big.textContent = days > 0 ? `${days} j` : hours > 0 ? `${hours} h ${mins} min` : `${mins} min`;
      sub.textContent = df.format(new Date(targetMs));
    };
    tick();
    const id = setInterval(tick, 30_000);
    return () => clearInterval(id);

    },

  title(w) {
    const tabs = Array.isArray(w.settings.tabs) ? w.settings.tabs : [];
    const active = tabs[w.settings.active];
    return active ? (active.label || active.folderPath?.split(' / ').pop() || 'Sans nom') : 'Dossier à onglets';
  },

  mount(body, ctx) {
    const s = ctx.settings;
    const tabs = Array.isArray(s.tabs) ? s.tabs : (s.tabs = []);

    clear(body);
    if (!tabs.length) {
      body.append(el('p', { class: 'note', text: 'Aucun onglet configuré. Ouvre les réglages du module.' }));
      return () => {};
    }

    let activeIdx = Math.min(Math.max(s.active || 0, 0), tabs.length - 1);

    const nav = el('nav', { class: 'foldertabs-nav' });
    const content = el('div', { class: 'foldertabs-content' });
    body.append(nav, content);

      clear(nav);
      tabs.forEach((tab, i) => {
        nav.append(el('button', {
          class: `foldertabs-tab${i === activeIdx ? ' is-active' : ''}`,
          type: 'button',
          text: tab.label || tab.folderPath?.split(' / ').pop() || 'Sans nom',
          onclick: () => {
            if (i === activeIdx) return;
            activeIdx = i;
            renderNav();
            browser.resetStack();
            browser.render();
            ctx.update({ active: activeIdx }, { silent: true });
          },
        }));
      });
    }
    renderNav();

    async function resolveRoot() {
      const tab = tabs[activeIdx];
      if (!tab) return null;
      if (tab.folderId) {
        try {
          const [node] = await chrome.bookmarks.get(String(tab.folderId));
          if (node) return node.id;
        } catch { /* id mort : on tente le chemin */ }
      }
      if (tab.folderPath) {
        const found = await findFolderByPath(tab.folderPath);
        if (found) {
          tab.folderId = found.id;               // auto-réparation en mémoire
          ctx.update({ tabs }, { silent: true });
          return found.id;
        }
      }
      // Aucun dossier Chrome assigné à cet onglet : il devient un dossier
      // virtuel propre à lui, rempli par glisser-déposer.
      return virtualFolderId(ctx.widget.id, tab.id);
    }

    const browser = mountFolderBrowser(content, {
      resolveRoot, settings: s,
      persistSettings: (patch) => ctx.update(patch, { silent: true }),
    });
    return () => browser.stop();
  },
});

/* Open-Meteo : gratuit, sans clé API. Seul widget de l'extension qui fait
   une requête réseau — voir docs/STORE.md pour la justification du
   host_permissions correspondant dans le manifeste. */

function weatherIcon(code) {
  if (code === 0) return '☀️';
  if (code === 1 || code === 2) return '⛅';
  if (code === 3) return '☁️';
  if (code === 45 || code === 48) return '🌫️';
  if ([51, 53, 55, 56, 57].includes(code)) return '🌦️';
  if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return '🌧️';
  if ([71, 73, 75, 77, 85, 86].includes(code)) return '🌨️';
  if ([95, 96, 99].includes(code)) return '⛈️';
  return '🌡️';
}

defineWidget({
  type: 'weather',
  name: 'Météo',
  category: 'autre',
  blurb: 'Température et conditions actuelles, via Open-Meteo (aucune clé API).',
  defaultSize: { w: 3, h: 1 },
  defaults: { city: '', label: '', lat: null, lon: null, resolvedName: '', geocodedCity: '' },
  fields: [
    { key: 'city', label: 'Ville', type: 'text', hint: 'Ex. Saint-Hippolyte, QC' },
    { key: 'label', label: 'Titre du module (vide = ville)', type: 'text' },
  ],
  title: (w) => w.settings.label || w.settings.resolvedName || 'Météo',

  mount(body, ctx) {
    const s = ctx.settings;
    let alive = true;
    const wrap = el('div', { class: 'weather' });
    clear(body);
    body.append(wrap);

    async function geocode(city) {
      const u = new URL('https://geocoding-api.open-meteo.com/v1/search');
      u.searchParams.set('name', city);
      u.searchParams.set('count', '1');
      u.searchParams.set('language', 'fr');
      u.searchParams.set('format', 'json');
      const res = await fetch(u);
      if (!res.ok) throw new Error('geocode');
      const hit = (await res.json()).results?.[0];
      if (!hit) throw new Error('not-found');
      return { lat: hit.latitude, lon: hit.longitude, name: [hit.name, hit.admin1].filter(Boolean).join(', ') };
    }

    async function fetchCurrent(lat, lon) {
      const u = new URL('https://api.open-meteo.com/v1/forecast');
      u.searchParams.set('latitude', lat);
      u.searchParams.set('longitude', lon);
      u.searchParams.set('current', 'temperature_2m,weather_code');
      u.searchParams.set('timezone', 'auto');
      const res = await fetch(u);
      if (!res.ok) throw new Error('forecast');
      return (await res.json()).current;
    }

    async function load() {
      if (!s.city?.trim()) {
        clear(wrap);
        wrap.append(el('p', { class: 'note', text: 'Choisis une ville dans les réglages du module.' }));
        return;
      }
      clear(wrap);
      wrap.append(el('p', { class: 'note', text: 'Chargement…' }));
      try {
        let { lat, lon, resolvedName } = s;
        if (!lat || !lon || s.geocodedCity !== s.city) {
          const g = await geocode(s.city);
          lat = g.lat; lon = g.lon; resolvedName = g.name;
          await ctx.update({ lat, lon, resolvedName, geocodedCity: s.city }, { silent: true });
        }
        const cur = await fetchCurrent(lat, lon);
        if (!alive) return;
        clear(wrap);
        wrap.append(
          el('div', { class: 'weather-icon', text: weatherIcon(cur.weather_code) }),
          el('div', { class: 'weather-temp', text: `${Math.round(cur.temperature_2m)}°C` }),
          el('div', { class: 'weather-place', text: resolvedName || s.city }),
        );
      } catch {
        if (!alive) return;
        clear(wrap);
        wrap.append(el('p', { class: 'note', text: 'Météo indisponible. Vérifie la ville ou ta connexion.' }));
      }
    }

    load();
    const id = setInterval(load, 15 * 60_000);
    return () => { alive = false; clearInterval(id); };
  },
});

/* ==== js/app.js ==== */
/* Enregistrement des modules. Ajoute ton import ici pour en brancher un nouveau. */




const $ = (id) => document.getElementById(id);
const grid = $('grid');
const mounted = new Map();      // id -> fonction de nettoyage
let editing = false;
let lastSig = '';

/* ============================================================
   Thème
   ============================================================ */

function applyTheme() {
  const board = store.board();
  const t = { ...store.data.theme, ...(board.theme || {}) };
  const { layout: l } = store.data;
  const r = document.documentElement;

  r.dataset.mode = t.mode;
  r.style.setProperty('--accent', t.accent);
  r.style.setProperty('--accent-ink', contrastInk(t.accent));
  r.style.setProperty('--radius', `${t.radius}px`);
  r.style.setProperty('--cols', l.cols);
  r.style.setProperty('--gap', `${l.gap}px`);
  r.style.setProperty('--row', `${l.row}px`);
  r.style.setProperty('--maxw', `${l.maxWidth}px`);
  r.style.setProperty('--wall-dim', t.wallpaperDim);

  document.body.dataset.density = t.density;
  document.body.dataset.labels = t.showLabels ? 'on' : 'off';
  document.body.classList.toggle('show-grid', !!t.showGrid);
  document.body.classList.toggle('has-wallpaper', !!store.wallpaper);
  $('wallpaper').style.backgroundImage = store.wallpaper ? `url("${store.wallpaper}")` : '';

  // Règle de colonnes du mode plan
  const ruler = $('ruler');
  if (ruler.childElementCount !== l.cols) {
    clear(ruler);
    for (let i = 0; i < l.cols; i++) ruler.append(el('span', { text: String(i + 1) }));
  }
}

/** Noir ou blanc au-dessus de l'accent, selon sa luminance. */
function contrastInk(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return '#14161a';
  const n = parseInt(m[1], 16);
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.45 ? '#14161a' : '#ffffff';
}

/* ============================================================
   Onglets (dashboards)
   ============================================================ */

function renderBoards() {
  const bar = $('boards');
  clear(bar);
  for (const b of store.data.boards) {
    const active = b.id === store.data.activeBoard;
    const tab = el('button', {
      class: `board-tab${active ? ' is-active' : ''}`,
      type: 'button',
      onclick: () => store.setActiveBoard(b.id),
    }, [el('span', { class: 'board-tab-name', text: b.name })]);
    if (active) {
      tab.append(el('button', {
        class: 'board-tab-gear', type: 'button', title: 'Réglages de l\'onglet',
        onclick: (e) => { e.stopPropagation(); openBoardSettings(b.id); },
        text: '⚙',
      }));
    }
    bar.append(tab);
  }
  bar.append(el('button', {
    class: 'board-tab board-tab-add', type: 'button', title: 'Nouvel onglet', text: '+',
    onclick: openAddBoard,
  }));
}

/* ============================================================
   Rendu de la feuille
   ============================================================ */

function sig() {
  return store.data.activeBoard + '|' + JSON.stringify(store.board().widgets);
}

function render() {
  renderBoards();
  applyTheme();
  const s = sig();
  if (s === lastSig) return;   // changement de thème seul : pas de remontage
  lastSig = s;
  rebuild();
}

function rebuild() {
  for (const stop of mounted.values()) { try { stop?.(); } catch { /* ignore */ } }
  mounted.clear();
  clear(grid);

  const list = store.board().widgets;
  $('empty').hidden = list.length > 0;

  list.forEach((w, i) => {
    const node = buildWidget(w);
    node.style.animationDelay = `${Math.min(i, 8) * 28}ms`;
    grid.append(node);
  });
}

function buildWidget(w) {
  const def = getWidget(w.type);
  const node = el('article', { class: `widget${w.color ? ' has-accent' : ''}`, 'data-id': w.id });
  node.style.setProperty('--w', w.w);
  node.style.setProperty('--h', w.h);
  if (w.color) node.style.setProperty('--widget-accent', w.color);

  const head = el('div', { class: 'widget-head' }, [
    el('span', { class: 'widget-title', text: def ? def.title(w) : 'Module inconnu' }),
    el('span', { class: 'widget-dim', text: `${w.w}×${w.h}` }),
    el('div', { class: 'widget-tools' }, [
      def ? el('button', {
        class: 'btn btn-ghost', type: 'button', title: 'Réglages du module', text: '⚙',
        onclick: () => openWidgetSettings(w.id),
      }) : null,
      el('button', {
        class: 'btn btn-ghost btn-danger', type: 'button', title: 'Retirer', text: '✕',
        onclick: () => store.removeWidget(w.id),
      }),
    ]),
  ]);

  const body = el('div', { class: 'widget-body' });
  node.append(head, body, el('div', { class: 'handle', title: 'Redimensionner' }));
  wireDrag(node, head);
  wireResize(node, w);

  if (!def) {
    body.append(el('p', { class: 'note', text: `Type « ${w.type} » non enregistré.` }));
    return node;
  }

  const ctx = {
    widget: w,
    settings: { ...def.defaults, ...w.settings },
    config: store.data,
    update: (patch, opts) => {
      Object.assign(ctx.settings, patch);
      return store.patchSettings(w.id, patch, opts);
    },
  };

  try {
    mounted.set(w.id, def.mount(body, ctx));
  } catch (err) {
    console.error('[Atelier]', w.type, err);
    body.append(el('p', { class: 'note', text: 'Ce module a planté. Voir la console.' }));
  }

  return node;
}

/* ============================================================
   Déplacement
   ============================================================ */

let dragged = null;

function wireDrag(node, head) {
  head.addEventListener('pointerdown', () => {
    node.draggable = editing;   // draggable seulement en mode plan
  });
  node.addEventListener('dragstart', (e) => {
    if (!editing) return e.preventDefault();
    dragged = node;
    node.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', node.dataset.id);
  });
  node.addEventListener('dragend', async () => {
    node.classList.remove('dragging');
    node.draggable = false;
    dragged = null;
    const ids = [...grid.querySelectorAll('.widget')].map((n) => n.dataset.id);
    await store.reorder(ids);
    lastSig = sig();
  });
}

grid.addEventListener('dragover', (e) => {
  if (!dragged) return;
  e.preventDefault();
  const ref = nearestSlot(e.clientX, e.clientY);
  if (ref === dragged) return;
  if (ref) grid.insertBefore(dragged, ref);
  else grid.append(dragged);
});

function nearestSlot(x, y) {
  const nodes = [...grid.querySelectorAll('.widget:not(.dragging)')];
  let best = null;
  let bestDist = Infinity;
  for (const n of nodes) {
    const b = n.getBoundingClientRect();
    const d = Math.hypot(x - (b.left + b.width / 2), y - (b.top + b.height / 2));
    if (d < bestDist) { bestDist = d; best = n; }
  }
  if (!best) return null;
  const b = best.getBoundingClientRect();
  const sameRow = Math.abs(y - (b.top + b.height / 2)) < b.height / 2;
  const before = sameRow ? x < b.left + b.width / 2 : y < b.top + b.height / 2;
  return before ? best : best.nextElementSibling;
}

/* ============================================================
   Redimensionnement
   ============================================================ */

function wireResize(node, w) {
  const handle = node.querySelector('.handle');
  handle.addEventListener('pointerdown', (e) => {
    if (!editing) return;
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    node.classList.add('resizing');

    const { cols, gap, row } = store.data.layout;
    const gridW = grid.getBoundingClientRect().width;
    const colUnit = (gridW - gap * (cols - 1)) / cols + gap;
    const rowUnit = row + gap;
    const start = { x: e.clientX, y: e.clientY, w: w.w, h: w.h };
    const dim = node.querySelector('.widget-dim');

    const move = (ev) => {
      const nw = clamp(Math.round(start.w + (ev.clientX - start.x) / colUnit), 1, cols);
      const nh = clamp(Math.round(start.h + (ev.clientY - start.y) / rowUnit), 1, 6);
      if (nw === w.w && nh === w.h) return;
      w.w = nw; w.h = nh;
      node.style.setProperty('--w', nw);
      node.style.setProperty('--h', nh);
      dim.textContent = `${nw}×${nh}`;
    };

    const up = async () => {
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      node.classList.remove('resizing');
      await store.patchWidget(w.id, { w: w.w, h: w.h }, { silent: true });
      lastSig = sig();
    };

    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
  });
}

/* ============================================================
   Mode plan
   ============================================================ */

function setEditing(on) {
  editing = on;
  document.body.classList.toggle('is-editing', on);
  $('dock').hidden = !on;
  $('btnEdit').setAttribute('aria-pressed', String(on));
  if (!on) grid.querySelectorAll('.widget').forEach((n) => { n.draggable = false; });
  if (on) showSidePanel(); else hideSidePanel();
}

/* ============================================================
   Recherche
   ============================================================ */

/* Préfixes de recherche : "yt: chats" saute direct sur YouTube. */
const SEARCH_PREFIXES = [
  ['g:', 'Google', 'https://www.google.com/search?q=%s'],
  ['yt:', 'YouTube', 'https://www.youtube.com/results?search_query=%s'],
  ['gh:', 'GitHub', 'https://github.com/search?q=%s'],
  ['wiki:', 'Wikipédia', 'https://fr.wikipedia.org/w/index.php?search=%s'],
  ['maps:', 'Maps', 'https://www.google.com/maps/search/%s'],
  ['img:', 'Images', 'https://www.google.com/search?tbm=isch&q=%s'],
  ['ddg:', 'DuckDuckGo', 'https://duckduckgo.com/?q=%s'],
];

function matchPrefix(q) {
  const trimmed = q.trimStart();
  const low = trimmed.toLowerCase();
  for (const [prefix, label, tpl] of SEARCH_PREFIXES) {
    if (low.startsWith(prefix)) {
      const rest = trimmed.slice(prefix.length).trim();
      return { label, rest, url: tpl.replace('%s', encodeURIComponent(rest)) };
    }
  }
  return null;
}

const omni = $('omni');
const results = $('omniResults');
let hits = [];
let cursor = -1;

const search = debounce(async (q) => {
  if (!q.trim()) return hideResults();
  const prefixed = matchPrefix(q);
  if (prefixed) {
    hits = [];
    cursor = -1;
    drawPrefixResult(prefixed);
    return;
  }
  let found = [];
  try {
    found = await chrome.bookmarks.search({ query: q });
  } catch { /* rien */ }
  hits = found.filter((n) => n.url).slice(0, 8);
  cursor = hits.length ? 0 : -1;
  drawResults(q);
}, 90);

function drawPrefixResult(p) {
  clear(results);
  results.hidden = false;
  results.append(el('li', {
    class: 'omni-item', role: 'option', 'aria-selected': 'true',
    onclick: (e) => go(p.url, e),
  }, [
    el('span', { class: 'glyph', text: '↵' }),
    el('span', {
      class: 'omni-title',
      text: p.rest ? `Rechercher « ${p.rest} » sur ${p.label}` : `Rechercher sur ${p.label}`,
    }),
  ]));
}

function drawResults(q) {
  clear(results);
  results.hidden = false;

  if (!hits.length) {
    results.append(el('li', {
      class: 'omni-empty',
      text: `Aucun favori. Entrée pour chercher « ${q} » sur le web.`,
    }));
    return;
  }

  hits.forEach((n, i) => {
    const img = el('img', { src: faviconUrl(n.url, 32), alt: '' });
    img.addEventListener('error', () => {
      img.replaceWith(el('span', { class: 'glyph', text: initial(n.title, n.url) }));
    });
    const li = el('li', {
      class: 'omni-item', role: 'option', 'aria-selected': String(i === cursor),
      onmouseenter: () => { cursor = i; syncSelection(); },
      onclick: (e) => go(n.url, e),
    }, [
      img,
      el('span', { class: 'omni-title', text: n.title || hostOf(n.url) }),
      el('span', { class: 'omni-url', text: hostOf(n.url) }),
    ]);
    results.append(li);
  });
}

function syncSelection() {
  [...results.children].forEach((li, i) => li.setAttribute('aria-selected', String(i === cursor)));
  results.children[cursor]?.scrollIntoView({ block: 'nearest' });
}

function hideResults() {
  results.hidden = true;
  clear(results);
  hits = [];
  cursor = -1;
}

function go(url, ev) {
  const openIn = store.data.search.openIn;
  if (openIn === 'new' || ev?.ctrlKey || ev?.metaKey) {
    if (chrome.tabs?.create) chrome.tabs.create({ url });
    else window.open(url, '_blank', 'noopener');
  } else {
    location.href = url;
  }
}

omni.addEventListener('input', () => search(omni.value));
omni.addEventListener('focus', () => { if (omni.value.trim()) search(omni.value); });
omni.addEventListener('blur', () => setTimeout(hideResults, 140));
omni.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' && hits.length) { e.preventDefault(); cursor = (cursor + 1) % hits.length; syncSelection(); }
  else if (e.key === 'ArrowUp' && hits.length) { e.preventDefault(); cursor = (cursor - 1 + hits.length) % hits.length; syncSelection(); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    const prefixed = matchPrefix(omni.value);
    if (prefixed) { go(prefixed.url, e); return; }
    const pick = hits[cursor];
    if (pick) go(pick.url, e);
    else if (omni.value.trim()) {
      go(store.data.search.engine.replace('%s', encodeURIComponent(omni.value.trim())), e);
    }
  } else if (e.key === 'Escape') {
    if (results.hidden) omni.blur();
    else hideResults();
  }
});

/* ============================================================
   Cartouche : heure et compteur
   ============================================================ */

function startTitleBlock() {
  try {
    $('tbVersion').textContent = `v${chrome.runtime.getManifest().version}`;
  } catch {
    $('tbVersion').textContent = '';
  }

  const timeFmt = new Intl.DateTimeFormat('fr-CA', { hour: '2-digit', minute: '2-digit', hour12: false });
  const dateFmt = new Intl.DateTimeFormat('fr-CA', { weekday: 'short', day: 'numeric', month: 'short' });
  const tick = () => {
    const now = new Date();
    $('tbTime').textContent = timeFmt.format(now);
    $('tbDate').textContent = dateFmt.format(now).replace('.', '');
  };
  tick();
  setInterval(tick, 20000);

  countBookmarks()
    .then((n) => { $('tbCount').textContent = `${n} favoris`; })
    .catch(() => { $('tbCount').textContent = ''; });
}

/* ============================================================
   Raccourcis clavier
   ============================================================ */

document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  const modalOpen = !$('modalRoot').hidden;

  if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    omni.focus();
    omni.select();
    return;
  }
  if (typing || modalOpen) return;

  if (e.key === '/') { e.preventDefault(); omni.focus(); }
  else if (e.key === 'e' || e.key === 'E') { setEditing(!editing); }
  else if (e.key === 'Escape' && editing) { setEditing(false); }
  else if (e.altKey && /^[1-9]$/.test(e.key)) {
    // Alt+1..9 : saute au module correspondant à sa position sur la feuille active.
    const node = grid.children[+e.key - 1];
    if (node) {
      e.preventDefault();
      node.scrollIntoView({ behavior: 'smooth', block: 'center' });
      node.classList.add('flash');
      setTimeout(() => node.classList.remove('flash'), 900);
    }
  }
});

/* ============================================================
   Premier lancement
   ============================================================ */

async function seed() {
  const tree = await chrome.bookmarks.getTree();
  const roots = tree[0]?.children || [];
  const bar = roots.find((n) => !n.url) || roots[0];

  store.board().widgets = [
    makeWidget('folder', {
      folderId: bar?.id ?? null,
      folderPath: bar?.title || '',
      view: 'tiles',
    }, { w: 8, h: 3 }),
    makeWidget('clock', { label: 'Horloge' }, { w: 4, h: 1 }),
    makeWidget('topsites', {}, { w: 4, h: 2 }),
  ];
  await store.save();
}

/* ============================================================
   Démarrage
   ============================================================ */

(async function boot() {
  await store.load();
  if (!store.board().widgets.length) {
    try { await seed(); } catch { /* pas de favoris : feuille vide */ }
  }

  store.on(render);
  render();
  startTitleBlock();
  requestAnimationFrame(() => document.body.classList.remove('booting'));

  $('btnEdit').addEventListener('click', () => setEditing(!editing));
  $('btnDone').addEventListener('click', () => setEditing(false));
  $('btnSettings').addEventListener('click', openSettings);
  $('btnChangelog').addEventListener('click', openChangelog);
  $('btnAdd').addEventListener('click', openAddWidget);
  $('emptyAdd').addEventListener('click', openAddWidget);

  // Config modifiée dans un autre onglet : on se resynchronise.
  chrome.storage.onChanged.addListener(async (changes, area) => {
    if (area !== 'local') return;
    if (store.selfWrites > 0) { store.selfWrites--; return; }
    if (changes.config || changes.wallpaper) {
      await store.load();
      render();
    }
  });
})().catch((err) => {
  console.error('[Atelier] démarrage impossible', err);
  toast('Démarrage impossible — voir la console');
});

})();
</script>
