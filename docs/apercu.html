<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier — aperçu</title>
<style>
/* ============================================================
   Atelier — feuille de plan
   Toutes les couleurs passent par des variables : le panneau
   de réglages les réécrit à chaud sur :root.
   ============================================================ */

:root {
  color-scheme: dark;

  /* Substrat */
  --ink:        #14161a;
  --panel:      #1a1d23;
  --panel-2:    #20242b;
  --rule:       #2b313a;
  --rule-soft:  #23282f;

  /* Encres */
  --graphite:   #e6e8ec;
  --graphite-2: #9aa3af;
  --graphite-3: #626b78;

  /* Laiton : l'accent par défaut, remplaçable */
  --accent:     #e3a008;
  --accent-ink: #14161a;

  --radius: 6px;
  --gap: 14px;
  --row: 132px;
  --cols: 12;
  --maxw: 1440px;

  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;

  --dur: 130ms;
  --ease: cubic-bezier(.2, .7, .3, 1);
}

:root[data-mode="light"] {
  color-scheme: light;
  --ink:        #eceae4;
  --panel:      #f7f6f2;
  --panel-2:    #ffffff;
  --rule:       #d3cfc5;
  --rule-soft:  #e2ded5;
  --graphite:   #1d2027;
  --graphite-2: #5a626e;
  --graphite-3: #8b929c;
  --accent-ink: #ffffff;
}

* { box-sizing: border-box; }

/* Les styles auteur battent la feuille du navigateur : sans ça,
   .dock{display:flex} rendrait l'attribut hidden inopérant. */
[hidden] { display: none !important; }

input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--graphite);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body.booting .sheet,
body.booting .titleblock { opacity: 0; }
body:not(.booting) .sheet,
body:not(.booting) .titleblock { transition: opacity 180ms var(--ease); }

@keyframes rise {
  from { opacity: 0; transform: translateY(7px); }
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- Fond ---------- */

.wallpaper {
  position: fixed; inset: 0; z-index: -2;
  background-size: cover; background-position: center;
  display: none;
}
body.has-wallpaper .wallpaper { display: block; }
body.has-wallpaper .wallpaper::after {
  content: ""; position: absolute; inset: 0;
  background: var(--ink);
  opacity: calc(var(--wall-dim, 55) / 100);
}

/* Le papier millimétré : discret au repos, révélé en mode plan */
.substrate {
  position: fixed; inset: 0; z-index: -1;
  pointer-events: none;
  opacity: 0;
  transition: opacity 220ms var(--ease);
  background-image:
    linear-gradient(to right, var(--rule-soft) 1px, transparent 1px),
    linear-gradient(to bottom, var(--rule-soft) 1px, transparent 1px);
  background-size: 22px 22px;
}
body.show-grid .substrate { opacity: .5; }
body.is-editing .substrate { opacity: 1; }

/* ---------- Cartouche ---------- */

.titleblock {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: stretch;
  gap: 0;
  max-width: var(--maxw);
  margin: 20px auto 0;
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(10px);
}

.tb-cell {
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px;
  border-right: 1px solid var(--rule-soft);
  min-height: 46px;
}
.tb-cell:last-child { border-right: 0; }

.tb-key {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--graphite-3);
  white-space: nowrap;
}
.tb-val {
  font-family: var(--font-mono);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--graphite);
  white-space: nowrap;
}
.tb-brand .tb-key { color: var(--accent); font-weight: 600; }

.tb-search { flex: 1; position: relative; padding-left: 12px; }
.tb-search input {
  flex: 1; width: 100%;
  background: transparent; border: 0; outline: 0;
  color: var(--graphite);
  font: inherit; font-size: 14px;
  padding: 12px 0;
}
.tb-search input::placeholder { color: var(--graphite-3); }
.tb-kbd {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--graphite-3);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 1px 5px;
}
.tb-search:focus-within .tb-kbd { opacity: 0; }

.tb-actions { gap: 6px; }

.tb-meta {
  display: flex; align-items: center; gap: 6px;
  margin-right: 4px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em;
  color: var(--graphite-3);
  white-space: nowrap;
}
.tb-meta button {
  background: none; border: 0; padding: 0;
  color: var(--graphite-3); font: inherit; letter-spacing: inherit;
  text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
}
.tb-meta button:hover { color: var(--accent); }

/* ---------- Journal des versions ---------- */

.changelog-entry { margin-bottom: 20px; }
.changelog-entry:last-child { margin-bottom: 0; }
.changelog-version {
  display: flex; align-items: baseline; gap: 8px;
  font-family: var(--font-mono); font-size: 13px; color: var(--accent);
  font-weight: 600; margin-bottom: 8px;
}
.changelog-date { font-size: 10px; color: var(--graphite-3); font-weight: 400; }
.changelog-section { margin-top: 10px; }
.changelog-section:first-of-type { margin-top: 0; }
.changelog-section-label {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--graphite-3); margin: 0 0 4px;
}
.changelog-entry ul { margin: 0; padding-left: 18px; }
.changelog-entry li { font-size: 12.5px; color: var(--graphite); margin-bottom: 3px; }

.omni-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  margin: 0; padding: 4px;
  list-style: none;
  background: var(--panel-2);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: 0 18px 40px rgb(0 0 0 / .38);
  max-height: 52vh; overflow-y: auto;
  z-index: 50;
}
.omni-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: 4px;
  cursor: pointer;
}
.omni-item[aria-selected="true"] { background: var(--panel); }
.omni-item img { width: 16px; height: 16px; flex: none; border-radius: 3px; }
.omni-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.omni-url {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--graphite-3);
  max-width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.omni-empty { padding: 10px; color: var(--graphite-3); font-size: 13px; }

/* ---------- Règle de colonnes (mode plan) ---------- */

.ruler {
  display: none;
  max-width: var(--maxw);
  margin: 10px auto 0;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gap);
}
body.is-editing .ruler { display: grid; }
.ruler span {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: .1em;
  color: var(--graphite-3);
  text-align: center;
  border-top: 1px solid var(--rule);
  padding-top: 3px;
}

/* ---------- Feuille ---------- */

.sheet {
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  grid-auto-rows: var(--row);
  gap: var(--gap);
  max-width: var(--maxw);
  margin: 18px auto 96px;
  padding: 0 0 4px;
}

/* ---------- Module ---------- */

.widget {
  grid-column: span var(--w, 3);
  grid-row: span var(--h, 2);
  display: flex; flex-direction: column;
  min-width: 0; min-height: 0;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
  animation: rise 260ms var(--ease) backwards;
}
.widget:hover { border-color: color-mix(in srgb, var(--rule) 60%, var(--graphite-3)); }

/* Couleur par module : même structure (fond translucide + bordure 1px) que
   le style par défaut, juste teintée par --widget-accent choisi dans les
   réglages du module. */
.widget.has-accent {
  background: color-mix(in srgb, var(--widget-accent) 9%, var(--panel) 91%);
  border-color: color-mix(in srgb, var(--widget-accent) 45%, var(--rule));
}
.widget.has-accent:hover { border-color: color-mix(in srgb, var(--widget-accent) 65%, var(--rule)); }
.widget.has-accent .widget-head { border-bottom-color: color-mix(in srgb, var(--widget-accent) 25%, var(--rule-soft)); }

.widget-head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--rule-soft);
  flex: none;
}
.widget-title {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--graphite-2);
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.widget-dim {
  display: none;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
body.is-editing .widget-dim { display: inline; }

.widget-tools { display: none; gap: 2px; }
body.is-editing .widget-tools { display: flex; }

.widget-body {
  flex: 1; min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 12px 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--rule) transparent;
}
.widget-body::-webkit-scrollbar { width: 8px; }
.widget-body::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 8px; }

/* Vue Pastilles, réglage « Design wrappé » : la marge du module est réduite
   au minimum pour que son contour colle aux pastilles. */
.widget-body.is-wrapped { padding: 4px; }
.widget-body.is-wrapped .bm-badges { gap: 4px; }

/* Mode plan : coins d'équerre + poignée */
body.is-editing .widget {
  cursor: default;
  border-style: dashed;
  border-color: color-mix(in srgb, var(--accent) 45%, var(--rule));
}
body.is-editing .widget-head { cursor: grab; }
body.is-editing .widget-head:active { cursor: grabbing; }
body.is-editing .widget-body { pointer-events: none; opacity: .62; }

.widget.dragging { opacity: .35; transform: scale(.99); }
.widget.resizing { border-color: var(--accent); }

.handle {
  display: none;
  position: absolute; right: 0; bottom: 0;
  width: 18px; height: 18px;
  cursor: nwse-resize;
}
.handle::before, .handle::after {
  content: ""; position: absolute; background: var(--accent);
}
.handle::before { right: 3px; bottom: 3px; width: 11px; height: 2px; }
.handle::after  { right: 3px; bottom: 3px; width: 2px; height: 11px; }
body.is-editing .widget { position: relative; }
body.is-editing .handle { display: block; }

/* ---------- Contenu : favoris ---------- */

.bm-crumbs {
  display: flex; align-items: center; gap: 4px;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .06em;
  color: var(--graphite-3);
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.bm-crumbs button {
  background: none; border: 0; padding: 0;
  color: var(--accent); cursor: pointer; font: inherit;
}

.bm-tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--tile, 74px), 1fr));
  gap: 4px;
}
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 4px;
  border-radius: 5px;
  text-decoration: none; color: var(--graphite);
  text-align: center;
  transition: background var(--dur) var(--ease);
}
.tile:hover, .tile:focus-visible { background: var(--panel-2); }
.tile img, .tile .glyph {
  width: var(--icon, 26px); height: var(--icon, 26px);
  border-radius: 5px; flex: none;
}
.tile .glyph {
  display: grid; place-items: center;
  background: var(--panel-2);
  border: 1px solid var(--rule);
  color: var(--accent);
  font-family: var(--font-mono); font-size: 11px;
}
.tile span.label {
  font-size: 11px; line-height: 1.25;
  color: var(--graphite-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; word-break: break-word;
}
body[data-labels="off"] .tile span.label { display: none; }
.tile.is-icon-only { justify-content: center; padding-top: 14px; padding-bottom: 14px; }

.bm-list { display: flex; flex-direction: column; gap: 1px; }
.row {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 7px;
  border-radius: 4px;
  text-decoration: none; color: var(--graphite);
}
.row:hover, .row:focus-visible { background: var(--panel-2); }
.row img, .row .glyph {
  width: 16px; height: 16px; flex: none; border-radius: 3px;
}
.row .glyph {
  display: grid; place-items: center;
  background: var(--panel-2); border: 1px solid var(--rule);
  color: var(--accent); font-size: 9px; font-family: var(--font-mono);
}
.row .label {
  flex: 1; font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row .host {
  font-family: var(--font-mono); font-size: 10px; color: var(--graphite-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%;
}
.bm-list.is-dense .row { padding: 2px 7px; }
.bm-list.is-dense .label { font-size: 12px; }
body[data-density="compact"] .row { padding: 3px 7px; }
body[data-density="compact"] .tile { padding: 7px 4px; }

.note {
  color: var(--graphite-3); font-size: 12px;
  font-family: var(--font-mono); letter-spacing: .04em;
}

/* ---------- Contenu : horloge ---------- */

.clock { display: grid; place-content: center; height: 100%; text-align: center; }
.clock-time {
  font-family: var(--font-mono);
  font-size: clamp(30px, 5.4vw, 58px);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em; line-height: 1;
}
.clock-date {
  margin-top: 8px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--graphite-3);
}

/* ---------- Contenu : bloc-notes ---------- */

.notes-area {
  width: 100%; height: 100%;
  min-height: 60px;
  background: transparent; border: 0; outline: 0; resize: none;
  color: var(--graphite);
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.65;
}
.notes-area::placeholder { color: var(--graphite-3); }

/* ---------- Boutons ---------- */

.btn {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--graphite-2);
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 6px 10px;
  cursor: pointer;
  transition: all var(--dur) var(--ease);
  white-space: nowrap;
}
.btn:hover { color: var(--graphite); border-color: var(--graphite-3); }
.btn-primary {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  font-weight: 600;
}
.btn-primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn-icon { padding: 6px; display: grid; place-items: center; }
.btn-ghost { border-color: transparent; padding: 4px 6px; }
.btn-ghost:hover { border-color: var(--rule); }
.btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.btn-danger:hover { color: #ff6b6b; border-color: #ff6b6b; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Dock / vide ---------- */

.dock {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  z-index: 45;
  display: flex; align-items: center; gap: 12px;
  padding: 9px 12px;
  background: var(--panel-2);
  border: 1px solid var(--rule);
  border-radius: 8px;
  box-shadow: 0 16px 40px rgb(0 0 0 / .4);
}
.dock-hint {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .06em; color: var(--graphite-3);
}

.empty { text-align: center; padding: 90px 20px; }
.empty-title { font-size: 16px; margin: 0 0 6px; }
.empty-help { color: var(--graphite-3); margin: 0 0 18px; font-size: 13px; }

/* ---------- Modale ---------- */

.modal-root {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center;
  background: rgb(0 0 0 / .55);
  padding: 24px;
}
.modal {
  width: min(560px, 100%);
  max-height: 84vh; overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 8px;
  box-shadow: 0 30px 70px rgb(0 0 0 / .5);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--rule);
  position: sticky; top: 0; background: var(--panel); z-index: 2;
}
.modal-head h2 {
  margin: 0;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--graphite-2);
  font-weight: 500;
}
.modal-body { padding: 16px 18px 20px; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 12px 18px; border-top: 1px solid var(--rule);
}

.field { margin-bottom: 14px; }
.field > label {
  display: block; margin-bottom: 6px;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--graphite-3);
}
.field input[type="text"],
.field input[type="number"],
.field select,
.field textarea {
  width: 100%;
  background: var(--ink);
  border: 1px solid var(--rule);
  border-radius: 4px;
  color: var(--graphite);
  font: inherit; font-size: 13px;
  padding: 8px 10px;
}
.field input[type="range"] { width: 100%; accent-color: var(--accent); }
.field input[type="color"] {
  width: 44px; height: 30px; padding: 2px;
  background: var(--ink); border: 1px solid var(--rule); border-radius: 4px;
}
.field-inline { display: flex; align-items: center; gap: 10px; }
.field-inline > label { margin: 0; flex: 1; text-transform: none; letter-spacing: 0; font-size: 13px; font-family: var(--font-ui); color: var(--graphite); }
.field-hint { margin-top: 5px; font-size: 11px; color: var(--graphite-3); }
.field-row { display: flex; gap: 12px; }
.field-row > .field { flex: 1; }

.section-label {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--graphite-3);
  border-top: 1px solid var(--rule-soft);
  padding-top: 14px; margin: 22px 0 12px;
}
.section-label:first-child { border-top: 0; padding-top: 0; margin-top: 0; }

.picker { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.picker button {
  text-align: left; padding: 12px;
  background: var(--ink); border: 1px solid var(--rule); border-radius: 5px;
  color: var(--graphite); cursor: pointer;
  transition: border-color var(--dur) var(--ease);
}
.picker button:hover { border-color: var(--accent); }
.picker strong { display: block; font-size: 13px; margin-bottom: 3px; font-weight: 500; }
.picker small { color: var(--graphite-3); font-size: 11px; }

.swatches { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.swatch {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer; padding: 0;
}
.swatch[aria-pressed="true"] { border-color: var(--graphite); }

.toast {
  position: fixed; bottom: 22px; left: 22px; z-index: 200;
  background: var(--panel-2); border: 1px solid var(--rule);
  border-left: 2px solid var(--accent);
  border-radius: 5px; padding: 10px 14px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em;
}

/* ---------- Onglets (dashboards) ---------- */

.boards {
  display: flex; align-items: flex-end; gap: 4px; flex-wrap: wrap;
  max-width: var(--maxw);
  margin: 12px auto 0;
  padding: 0 2px;
}
.board-tab {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: .06em;
  color: var(--graphite-3);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px 6px 0 0;
  padding: 7px 12px;
  cursor: pointer;
  transition: color var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.board-tab:hover { color: var(--graphite); }
.board-tab.is-active {
  color: var(--accent);
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  border-color: var(--rule);
  border-bottom-color: transparent;
}
.board-tab-gear {
  background: none; border: 0; padding: 0; margin: 0;
  color: inherit; font-size: 10px; cursor: pointer; opacity: .7; line-height: 1;
}
.board-tab-gear:hover { opacity: 1; }
.board-tab-add { font-size: 14px; padding: 7px 10px; }

@keyframes flash-pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent); }
  35% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 55%, transparent); }
}
.widget.flash { animation: flash-pulse 900ms var(--ease); border-color: var(--accent); }

/* ---------- Contenu : pastilles + renommage local ---------- */

.bm-badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge {
  display: grid; place-items: center;
  width: calc(var(--icon, 26px) + 14px); height: calc(var(--icon, 26px) + 14px);
  border-radius: 50%;
  background: var(--panel-2);
  border: 1px solid var(--rule);
  text-decoration: none; color: var(--graphite);
  transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.badge:hover, .badge:focus-visible { border-color: var(--accent); transform: translateY(-1px); }
.badge img, .badge .glyph { width: var(--icon, 26px); height: var(--icon, 26px); border-radius: 50%; }
.badge .glyph { display: grid; place-items: center; background: transparent; border: 0; }

.tile { position: relative; }
.bm-rename {
  background: var(--panel-2); border: 1px solid var(--rule);
  border-radius: 50%; width: 18px; height: 18px; padding: 0;
  display: grid; place-items: center; flex: none;
  color: var(--graphite-3); font-size: 9px; cursor: pointer;
  opacity: 0; transition: opacity var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.bm-rename:hover { color: var(--accent); border-color: var(--accent); }
.tile .bm-rename { position: absolute; top: 2px; right: 2px; }
.tile:hover .bm-rename, .tile:focus-within .bm-rename { opacity: 1; }
.row:hover .bm-rename, .row:focus-within .bm-rename { opacity: 1; }

/* ---------- Contenu : horloge, second fuseau ---------- */

.clock-tz2 {
  margin-top: 4px;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .08em; color: var(--graphite-3);
}

/* ---------- Contenu : compte à rebours ---------- */

.countdown { display: grid; place-content: center; height: 100%; text-align: center; gap: 4px; }
.countdown-big {
  font-family: var(--font-mono);
  font-size: clamp(20px, 3.4vw, 34px);
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
.countdown-sub {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .08em; color: var(--graphite-3);
}

/* ---------- Contenu : dossier façon iPhone ---------- */

.folder-open {
  width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  background: none; border: 0; cursor: pointer; color: var(--graphite); font: inherit;
}
.folder-preview {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;
  width: 44px; height: 44px;
  padding: 5px;
  background: var(--panel-2);
  border: 1px solid var(--rule);
  border-radius: 9px;
}
.folder-preview img, .folder-preview .glyph { width: 100%; height: 100%; border-radius: 3px; }
.folder-slot-empty { border-radius: 3px; background: color-mix(in srgb, var(--rule) 40%, transparent); }
/* Variante intégrée dans une tuile/ligne/pastille : sous-dossier fait main,
   toujours en icône compacte quel que soit l'Affichage du module parent. */
.folder-preview-mini { width: var(--fp-size, 28px); height: var(--fp-size, 28px); padding: 3px; gap: 2px; flex: none; }
.badge .folder-preview-mini { border-radius: 50%; }
.folder-name {
  font-size: 11px; color: var(--graphite-2);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.folder-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 10px;
}
.folder-grid .tile { padding: 10px 4px; }

/* ---------- Contenu : météo ---------- */

.weather { display: grid; place-content: center; height: 100%; text-align: center; gap: 2px; }
.weather-icon { font-size: clamp(22px, 3.6vw, 34px); line-height: 1; }
.weather-temp {
  font-family: var(--font-mono); font-size: clamp(18px, 2.6vw, 26px);
  font-variant-numeric: tabular-nums;
}
.weather-place {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .06em; color: var(--graphite-3);
}

/* ---------- Glisser des favoris entre modules, en mode plan ---------- */

/* Spécificité plus élevée que `body.is-editing .widget-body` : le module
   Dossier de favoris reste interactif pendant le mode plan pour permettre
   le glisser d'un favori vers un autre module. */
body.is-editing .widget-body.bm-dnd { pointer-events: auto; opacity: 1; }

.dragging-bm { opacity: .35; }
.bm-drop-target {
  outline: 2px dashed var(--accent);
  outline-offset: 4px;
  border-radius: 6px;
}
/* Voisin le plus proche du pointeur pendant le glisser : là où ça va se poser. */
.bm-insert-target { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }

/* Favori/dossier classé virtuellement ici (autre dossier réel dans Chrome) :
   petit point discret, visible seulement au survol pour ne pas surcharger. */
.bm-virtual { position: relative; }
.bm-virtual::after {
  content: ""; position: absolute; top: 3px; right: 3px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent);
  opacity: 0; transition: opacity var(--dur) var(--ease);
}
.bm-virtual:hover::after, .bm-virtual:focus-visible::after { opacity: 1; }
.row.bm-virtual::after { top: 50%; right: 6px; transform: translateY(-50%); }

/* ---------- Menu contextuel ---------- */

.ctx-menu {
  position: fixed; z-index: 300;
  min-width: 180px;
  background: var(--panel-2);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 4px;
  box-shadow: 0 18px 40px rgb(0 0 0 / .4);
}
.ctx-item {
  display: block; width: 100%; text-align: left;
  background: none; border: 0; border-radius: 4px;
  padding: 8px 10px;
  color: var(--graphite);
  font: inherit; font-size: 13px;
  cursor: pointer;
}
.ctx-item:hover { background: var(--panel); color: var(--accent); }
.ctx-sep { height: 1px; margin: 4px 2px; background: var(--rule-soft); }

/* ---------- Fiche détails d'un favori ---------- */

.bm-details-row {
  display: flex; flex-direction: column; gap: 3px;
  padding: 8px 0;
  border-bottom: 1px solid var(--rule-soft);
}
.bm-details-row:last-child { border-bottom: 0; }
.bm-details-label {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--graphite-3);
}
.bm-details-value {
  font-size: 13px; color: var(--graphite);
  word-break: break-all;
}

/* ---------- Éditeur d'onglets (réglages du module Dossier à onglets) ---------- */

.tablist-editor { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.tablist-row { display: flex; align-items: center; gap: 6px; }
.tablist-row select { flex: 1.3; min-width: 0; }
.tablist-row input[type="text"] { flex: 1; min-width: 0; }
.tablist-row select,
.tablist-row input[type="text"] {
  background: var(--ink); border: 1px solid var(--rule); border-radius: 4px;
  color: var(--graphite); font: inherit; font-size: 13px; padding: 7px 8px;
}

/* ---------- Contenu : dossier à onglets ---------- */

.foldertabs-nav {
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-bottom: 8px;
}
.foldertabs-tab {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em;
  color: var(--graphite-3);
  background: var(--panel-2);
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 4px 10px;
  cursor: pointer;
  transition: all var(--dur) var(--ease);
}
.foldertabs-tab:hover { color: var(--graphite); }
.foldertabs-tab.is-active { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

/* ---------- Panneau latéral : tous les favoris (mode plan) ---------- */

.side-panel {
  /* top réajusté en JS (sidepanel.js/syncTop) sous la cartouche, qui est en
     position: sticky et n'a donc pas de hauteur fixe fiable en CSS seul. */
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 35;
  width: 280px;
  display: flex; flex-direction: column;
  gap: 10px;
  padding: 16px 14px;
  background: var(--panel-2);
  border-left: 1px solid var(--rule);
  box-shadow: -18px 0 40px rgb(0 0 0 / .35);
  animation: rise 200ms var(--ease);
}
.sp-head { display: flex; flex-direction: column; gap: 2px; }
.sp-title {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--accent); font-weight: 600;
}
.sp-hint { font-size: 11px; color: var(--graphite-3); }
.sp-search {
  background: var(--ink); border: 1px solid var(--rule); border-radius: 5px;
  color: var(--graphite); font: inherit; font-size: 13px; padding: 8px 10px;
}
.sp-list {
  flex: 1; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 2px;
  scrollbar-width: thin; scrollbar-color: var(--rule) transparent;
}
.sp-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 5px; cursor: grab;
  transition: background var(--dur) var(--ease);
}
.sp-row:hover { background: var(--panel); }
.sp-row img, .sp-row .glyph { width: 18px; height: 18px; flex: none; border-radius: 4px; }
.sp-row .glyph {
  display: grid; place-items: center;
  background: var(--ink); border: 1px solid var(--rule);
  color: var(--accent); font-size: 9px; font-family: var(--font-mono);
}
.sp-row-text { min-width: 0; display: flex; flex-direction: column; }
.sp-row-title {
  font-size: 12.5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sp-row-path {
  font-family: var(--font-mono); font-size: 10px; color: var(--graphite-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ---------- Responsive ---------- */

@media (max-width: 1100px) { :root { --cols: 8; } }
@media (max-width: 760px) {
  :root { --cols: 4; --gap: 10px; }
  .titleblock { flex-wrap: wrap; margin-inline: 12px; }
  .tb-search { order: 3; flex-basis: 100%; border-right: 0; border-top: 1px solid var(--rule-soft); }
  .sheet, .ruler { padding-inline: 12px; }
  .widget { grid-column: 1 / -1; }
  .dock-hint { display: none; }
  .side-panel { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

    runtime: { getURL: (p) => 'preview://' + p, getManifest: () => ({ version: 'aperçu' }) },
    storage: {
      local: {
        async get(keys) {
          const list = keys == null ? Object.keys(mem) : [].concat(keys);
          return Object.fromEntries(list.filter((k) => k in mem).map((k) => [k, mem[k]]));
        },
        async set(obj) { Object.assign(mem, obj); persist(); },
        async remove(k) { [].concat(k).forEach((x) => delete mem[x]); persist(); },
        async getBytesInUse() { return JSON.stringify(mem).length; },
      },
      onChanged: noop(),
    },
    bookmarks: {
      async getTree() { return [hydrate(rootId)]; },
      async get(id) { return B[id] ? [{ ...B[id] }] : []; },
      async getChildren(id) { return (B[id]?.children || []).map((c) => ({ ...B[c] })); },
      async search({ query }) {
        const q = String(query).toLowerCase();
        return Object.values(B).filter((b) => b.url && (b.title.toLowerCase().includes(q) || b.url.toLowerCase().includes(q)));
      },
      async move(id, { parentId, index }) {
        const node = B[id];
        const newParent = B[parentId];
        if (!node || !newParent) throw new Error('déplacement invalide');
        const oldParent = B[node.parentId];
        if (oldParent) oldParent.children = oldParent.children.filter((c) => c !== id);
        node.parentId = parentId;
        if (typeof index === 'number') newParent.children.splice(index, 0, id);
        else newParent.children.push(id);
        movedListeners.forEach((fn) => fn(id, { parentId }));
        return [{ ...node }];
      },
      onCreated: noop(), onRemoved: noop(), onChanged: noop(),
      onMoved: { addListener: (fn) => movedListeners.add(fn), removeListener: (fn) => movedListeners.delete(fn) },
    },
    topSites: {
      async get() {
        return [
          { title: 'Gmail', url: 'https://mail.google.com/' },
          { title: 'GitHub', url: 'https://github.com/' },
          { title: 'YouTube', url: 'https://www.youtube.com/' },
          { title: 'Claude', url: 'https://claude.ai/' },
          { title: 'Cloudflare', url: 'https://dash.cloudflare.com/' },
          { title: 'Hostinger', url: 'https://hpanel.hostinger.com/' },
          { title: 'Stripe', url: 'https://dashboard.stripe.com/' },
          { title: 'Figma', url: 'https://www.figma.com/' },
        ];
      },
    },
    tabs: { create({ url }) { window.open(url, '_blank', 'noopener'); } },
  };

  /* Dans l'extension, Chrome sert les favicons via /_favicon/.
     Ici on passe par un service public pour que l'aperçu ressemble au vrai. */
  window.__previewFavicon = (pageUrl, size) => {
    try {
      return `https://www.google.com/s2/favicons?domain=${new URL(pageUrl).hostname}&sz=${size >= 32 ? 64 : 32}`;
    } catch { return ''; }
  };
})();

<script>
(function(){

/* ==== js/store.js ==== */
/* Config : lecture/écriture dans chrome.storage.local + abonnements.
   Le fond d'écran vit dans une clé séparée pour garder l'export léger. */

const KEY = 'config';
const WALL = 'wallpaper';
const SCHEMA_VERSION = 2;

function uid(prefix = 'w') {
  return prefix + Math.random().toString(36).slice(2, 9);
}

function defaultBoard() {
  return { id: uid('b'), name: 'Principal', widgets: [], theme: null };
}

const DEFAULT_CONFIG = {
  version: SCHEMA_VERSION,
  theme: {
    mode: 'dark',
    accent: '#e3a008',
    density: 'comfy',
    radius: 6,
    showGrid: false,
    showLabels: true,
    wallpaperDim: 55,
  },
  layout: { cols: 12, gap: 14, row: 132, maxWidth: 1440 },
  search: {
    engine: 'https://www.google.com/search?q=%s',
    openIn: 'current',
  },
  aliases: {},
  /* Organisation locale des favoris, jamais écrite dans les vrais favoris Chrome :
     - folderOrder[folderId]  = ordre manuel des enfants affichés dans ce dossier
     - folderOverride[nodeId] = dossier réel où AFFICHER ce favori/dossier,
       différent de son vrai parent Chrome (classement virtuel entre modules) */
  folderOrder: {},
  folderOverride: {},
  /* Sous-dossiers créés à la main (clic droit → Nouveau sous-dossier),
     façon écran d'accueil de téléphone — n'existent que dans Atelier :
     { [id]: { name, parent } }, id et parent référencent soit un vrai
     dossier Chrome, soit un autre sous-dossier virtuel. */
  virtualFolders: {},
  boards: [defaultBoard()],
  activeBoard: null, // résolu vers boards[0].id à la migration
};

function makeWidget(type, settings = {}, size = {}) {
  return {
    id: uid(),
    type,
    w: size.w ?? 3,
    h: size.h ?? 2,
    color: null,
    settings,
  };
}

function sanitizeWidgets(list) {
  return (Array.isArray(list) ? list : [])
    .filter((w) => w && typeof w.type === 'string')
    .map((w) => ({
      id: w.id || uid(),
      type: w.type,
      w: clamp(+w.w || 3, 1, 12),
      h: clamp(+w.h || 2, 1, 6),
      color: typeof w.color === 'string' && /^#[0-9a-f]{6}$/i.test(w.color) ? w.color : null,
      settings: w.settings && typeof w.settings === 'object' ? w.settings : {},
    }));
}

function sanitizeBoard(b) {
  const theme = b && b.theme && typeof b.theme === 'object' && (b.theme.mode || b.theme.accent)
    ? {
        mode: b.theme.mode === 'light' ? 'light' : DEFAULT_CONFIG.theme.mode,
        accent: typeof b.theme.accent === 'string' ? b.theme.accent : DEFAULT_CONFIG.theme.accent,
      }
    : null;
  return {
    id: (b && b.id) || uid('b'),
    name: (b && typeof b.name === 'string' && b.name.trim()) || 'Sans titre',
    widgets: sanitizeWidgets(b && b.widgets),
    theme,
  };
}

function migrate(cfg) {
  if (!cfg || typeof cfg !== 'object') return migrate({});
  // Fusion superficielle par section : les nouvelles clés d'une version
  // future arrivent avec leur valeur par défaut sans écraser l'existant.
  const out = structuredClone(DEFAULT_CONFIG);
  for (const k of ['theme', 'layout', 'search']) {
    out[k] = { ...out[k], ...(cfg[k] || {}) };
  }
  out.aliases = cfg.aliases && typeof cfg.aliases === 'object' ? { ...cfg.aliases } : {};
  out.folderOverride = cfg.folderOverride && typeof cfg.folderOverride === 'object' ? { ...cfg.folderOverride } : {};
  out.folderOrder = {};
  if (cfg.folderOrder && typeof cfg.folderOrder === 'object') {
    for (const [k, v] of Object.entries(cfg.folderOrder)) {
      if (Array.isArray(v)) out.folderOrder[k] = v.filter((id) => typeof id === 'string');
    }
  }
  out.virtualFolders = {};
  if (cfg.virtualFolders && typeof cfg.virtualFolders === 'object') {
    for (const [id, vf] of Object.entries(cfg.virtualFolders)) {
      if (vf && typeof vf.name === 'string' && typeof vf.parent === 'string') {
        out.virtualFolders[id] = { name: vf.name, parent: vf.parent };
      }
    }
  }

  if (Array.isArray(cfg.boards) && cfg.boards.length) {
    // Schéma v2 : plusieurs feuilles.
    out.boards = cfg.boards.map(sanitizeBoard);
  } else if (Array.isArray(cfg.widgets)) {
    // Schéma v1 : une seule liste de modules à la racine — on l'enveloppe.
    out.boards = [{ ...defaultBoard(), name: 'Principal', widgets: sanitizeWidgets(cfg.widgets) }];
  } else {
    out.boards = [defaultBoard()];
  }

  out.activeBoard = out.boards.some((b) => b.id === cfg.activeBoard)
    ? cfg.activeBoard
    : out.boards[0].id;

  out.version = SCHEMA_VERSION;
  return out;
}

function clamp(n, min, max) {
  return Math.min(max, Math.max(min, n));
}

const listeners = new Set();

const store = {
  data: structuredClone(DEFAULT_CONFIG),
  wallpaper: null,
  /* Compteur d'écritures locales : chrome.storage.onChanged se déclenche
     aussi dans l'onglet qui écrit, on ne veut pas recharger pour rien. */
  selfWrites: 0,

  async load() {
    const got = await chrome.storage.local.get([KEY, WALL]);
    this.data = migrate(got[KEY]);
    this.wallpaper = got[WALL] || null;
    return this.data;
  },

  /** Persiste et notifie. `silent` évite le re-rendu complet (ex. autosave notes). */
  async save({ silent = false } = {}) {
    this.selfWrites++;
    await chrome.storage.local.set({ [KEY]: this.data });
    if (!silent) listeners.forEach((fn) => fn(this.data));
  },

  async setWallpaper(dataUrl) {
    this.wallpaper = dataUrl;
    this.selfWrites++;
    if (dataUrl) await chrome.storage.local.set({ [WALL]: dataUrl });
    else await chrome.storage.local.remove(WALL);
    listeners.forEach((fn) => fn(this.data));
  },

  on(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  },

  emit() {
    listeners.forEach((fn) => fn(this.data));
  },

  /** Le dashboard actif — celui qu'on affiche et qu'on édite. */
  board() {
    return this.data.boards.find((b) => b.id === this.data.activeBoard) || this.data.boards[0];
  },

  async addBoard(name) {
    const b = { id: uid('b'), name: name?.trim() || 'Sans titre', widgets: [], theme: null };
    this.data.boards.push(b);
    this.data.activeBoard = b.id;
    await this.save();
    return b;
  },

  async renameBoard(id, name) {
    const b = this.data.boards.find((x) => x.id === id);
    if (!b || !name?.trim()) return;
    b.name = name.trim();
    await this.save();
  },

  async setBoardTheme(id, theme) {
    const b = this.data.boards.find((x) => x.id === id);
    if (!b) return;
    b.theme = theme;
    await this.save();
  },

  /** Refuse de supprimer le dernier dashboard restant. */
  async removeBoard(id) {
    if (this.data.boards.length <= 1) return false;
    this.data.boards = this.data.boards.filter((b) => b.id !== id);
    if (this.data.activeBoard === id) this.data.activeBoard = this.data.boards[0].id;
    await this.save();
    return true;
  },

  async setActiveBoard(id) {
    if (!this.data.boards.some((b) => b.id === id) || id === this.data.activeBoard) return;
    this.data.activeBoard = id;
    await this.save();
  },

  widget(id) {
    return this.board().widgets.find((w) => w.id === id);
  },

  async patchWidget(id, patch, opts) {
    const w = this.widget(id);
    if (!w) return;
    Object.assign(w, patch);
    await this.save(opts);
  },

  async patchSettings(id, patch, opts) {
    const w = this.widget(id);
    if (!w) return;
    w.settings = { ...w.settings, ...patch };
    await this.save(opts);
  },

  async addWidget(w) {
    this.board().widgets.push(w);
    await this.save();
    return w;
  },

  async removeWidget(id) {
    const b = this.board();
    b.widgets = b.widgets.filter((w) => w.id !== id);
    await this.save();
  },

  async reorder(ids) {
    const b = this.board();
    const map = new Map(b.widgets.map((w) => [w.id, w]));
    b.widgets = ids.map((id) => map.get(id)).filter(Boolean);
    await this.save({ silent: true });
  },

  /** Alias local d'un favori (titre affiché seulement) — le vrai favori Chrome n'est jamais touché. */
  async setAlias(bookmarkId, text) {
    const clean = text?.trim();
    if (clean) this.data.aliases[bookmarkId] = clean;
    else delete this.data.aliases[bookmarkId];
    await this.save({ silent: true });
  },

  /** Ordre local des enfants d'un dossier — jamais écrit dans les vrais favoris Chrome. */
  async setFolderOrder(folderId, ids) {
    this.data.folderOrder[folderId] = ids;
    await this.save({ silent: true });
  },

  /** Classement virtuel : affiche ce favori/dossier sous `targetFolderId` dans Atelier,
      sans jamais le déplacer dans les vrais favoris Chrome. `null` retire le classement. */
  async setFolderOverride(nodeId, targetFolderId) {
    if (targetFolderId) this.data.folderOverride[nodeId] = targetFolderId;
    else delete this.data.folderOverride[nodeId];
    await this.save({ silent: true });
  },

  /** Sous-dossier virtuel : n'existe que dans Atelier, jamais dans les vrais
      favoris Chrome. `id` et `parent` sont fabriqués par bmview.js. */
  async setVirtualFolder(id, name, parent) {
    this.data.virtualFolders[id] = { name: name?.trim() || 'Sans nom', parent };
    await this.save({ silent: true });
  },

  async renameVirtualFolder(id, name) {
    const vf = this.data.virtualFolders[id];
    if (!vf || !name?.trim()) return;
    vf.name = name.trim();
    await this.save({ silent: true });
  },

  async removeVirtualFolder(id) {
    delete this.data.virtualFolders[id];
    await this.save({ silent: true });
  },

  async bytesInUse() {
    try {
      return await chrome.storage.local.getBytesInUse(null);
    } catch {
      return 0;
    }
  },

  export() {
    return JSON.stringify({ ...this.data, version: SCHEMA_VERSION }, null, 2);
  },

  async import(json) {
    const parsed = JSON.parse(json);
    this.data = migrate(parsed);
    await this.save();
  },

  async reset() {
    this.data = migrate(structuredClone(DEFAULT_CONFIG));
    await chrome.storage.local.remove(WALL);
    this.wallpaper = null;
    await this.save();
  },
};

/* ==== js/registry.js ==== */
/* Registre des modules.
   Pour en ajouter un : crée js/widgets/mon-module.js, appelle defineWidget(),
   puis importe le fichier dans js/app.js. C'est tout. */

const defs = new Map();

/** Catégories affichées dans « Ajouter un module », dans cet ordre. Un
    module sans `category` reconnue tombe dans « Autre ». La liste est
    appelée à grandir au fil des nouveaux modules — voir groupedVisibleWidgets. */
const CATEGORIES = [
  ['principal', 'Principal'],
  ['productivite', 'Productivité'],
  ['autre', 'Autre'],
];
const DEFAULT_CATEGORY = 'autre';

/**
 * @param {object} def
 * @param {string} def.type            identifiant stable, stocké dans la config
 * @param {string} def.name            nom affiché dans « Ajouter un module »
 * @param {string} def.blurb           une ligne de description
 * @param {string} [def.category]      groupe dans « Ajouter un module », voir CATEGORIES
 * @param {{w:number,h:number}} def.defaultSize
 * @param {object} def.defaults        réglages par défaut
 * @param {Array}  def.fields          schéma du formulaire de réglages
 * @param {(w:object)=>string} def.title  titre affiché dans l'en-tête
 * @param {(body:HTMLElement, ctx:object)=>(void|Function)} def.mount
 *        rend le contenu ; peut retourner une fonction de nettoyage
 */
function defineWidget(def) {
  defs.set(def.type, {
    defaultSize: { w: 3, h: 2 },
    defaults: {},
    fields: [],
    category: DEFAULT_CATEGORY,
    title: (w) => def.name,
    ...def,
  });
}

const getWidget = (type) => defs.get(type);
const allWidgets = () => [...defs.values()];
/** Comme allWidgets(), sans les types cachés (alias gardés pour compatibilité
    arrière — ex. l'ancien type "bookmarks", fusionné dans "folder"). */
const visibleWidgets = () => [...defs.values()].filter((d) => !d.hidden);
/** visibleWidgets(), regroupés par catégorie dans l'ordre de CATEGORIES —
    pour « Ajouter un module ». Les catégories sans module visible sont omises. */
function groupedVisibleWidgets() {
  const visible = visibleWidgets();
  return CATEGORIES
    .map(([key, label]) => [key, label, visible.filter((d) => (d.category || DEFAULT_CATEGORY) === key)])
    .filter(([, , list]) => list.length);
}

/* ==== js/ui.js ==== */
/* Petits utilitaires partagés. Rien ici ne connaît la config. */

/** el('div', {class:'x', onclick:fn}, [enfants|texte]) */
function el(tag, attrs = {}, kids = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'html') node.innerHTML = v; // réservé au markup statique
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of [].concat(kids)) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

/** Favicon servi par Chrome. Exige la permission "favicon" dans le manifeste. */
function faviconUrl(pageUrl, size = 32) {
  if (window.__previewFavicon) return window.__previewFavicon(pageUrl, size);
  const u = new URL(chrome.runtime.getURL('/_favicon/'));
  u.searchParams.set('pageUrl', pageUrl);
  u.searchParams.set('size', String(size));
  return u.toString();
}

function hostOf(url) {
  try {
    return new URL(url).hostname.replace(/^www\./, '');
  } catch {
    return url;
  }
}

/** Première lettre utilisable, pour la pastille de repli. */
function initial(title, url) {
  const src = (title || hostOf(url) || '?').trim();
  return (src[0] || '?').toUpperCase();
}

/** Ouvre un lien selon la préférence, en respectant ctrl/cmd/molette. */
function openLink(url, openIn, ev) {
  const newTab = openIn === 'new' || ev?.ctrlKey || ev?.metaKey || ev?.button === 1;
  if (newTab) {
    ev?.preventDefault();
    if (chrome.tabs?.create) chrome.tabs.create({ url, active: !ev?.shiftKey });
    else window.open(url, '_blank', 'noopener');
  }
  // sinon : on laisse le <a href> faire son travail
}

/* ---------- Arbre des favoris ---------- */

/** Liste plate des dossiers, avec chemin lisible. */
async function listFolders() {
  const tree = await chrome.bookmarks.getTree();
  const out = [];
  const walk = (node, depth, path) => {
    for (const child of node.children || []) {
      if (child.url) continue;
      const label = child.title || '(sans nom)';
      const full = path ? `${path} / ${label}` : label;
      out.push({ id: child.id, title: label, path: full, depth });
      walk(child, depth + 1, full);
    }
  };
  walk(tree[0], 0, '');
  return out;
}

/** Retrouve un dossier par son chemin — utile après un import sur un autre profil. */
async function findFolderByPath(path) {
  if (!path) return null;
  const folders = await listFolders();
  return folders.find((f) => f.path === path) || null;
}

/** Liste plate de TOUS les favoris (liens, pas les dossiers), avec le chemin
    de leur dossier réel — utilisé par le panneau « Tous les favoris » en
    mode plan. */
async function listAllBookmarks() {
  const tree = await chrome.bookmarks.getTree();
  const out = [];
  const walk = (node, path) => {
    for (const child of node.children || []) {
      if (child.url) {
        out.push({ id: child.id, title: child.title, url: child.url, path });
      } else {
        const label = child.title || '(sans nom)';
        walk(child, path ? `${path} / ${label}` : label);
      }
    }
  };
  walk(tree[0], '');
  return out;
}

async function countBookmarks() {
  const tree = await chrome.bookmarks.getTree();
  let n = 0;
  const walk = (node) => {
    for (const c of node.children || []) {
      if (c.url) n++;
      else walk(c);
    }
  };
  walk(tree[0]);
  return n;
}

/* ---------- Modale ---------- */

const root = () => document.getElementById('modalRoot');

function openModal({ title, body, footer, onClose }) {
  const host = root();
  clear(host);
  host.hidden = false;

  const onBackdrop = (e) => { if (e.target === host) close(); };
  const close = () => {
    host.hidden = true;
    clear(host);
    document.removeEventListener('keydown', onKey);
    host.removeEventListener('click', onBackdrop);
    onClose?.();
  };
  const onKey = (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
  };
  document.addEventListener('keydown', onKey);

  const modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, [
    el('div', { class: 'modal-head' }, [
      el('h2', { text: title }),
      el('button', { class: 'btn btn-ghost', type: 'button', 'aria-label': 'Fermer', onclick: close, text: '✕' }),
    ]),
    el('div', { class: 'modal-body' }, [body]),
    footer ? el('div', { class: 'modal-foot' }, [footer]) : null,
  ]);

  host.addEventListener('click', onBackdrop);
  host.append(modal);
  modal.querySelector('input, select, textarea, button')?.focus();
  return close;
}

/* ---------- Toast ---------- */

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

function debounce(fn, ms) {
  let t;
  return (...a) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...a), ms);
  };
}

/** Vrai pendant le mode plan. Les widgets s'en servent pour désarmer la
    navigation normale (clic sur un lien) sans désactiver le glisser. */
function isEditing() {
  return document.body.classList.contains('is-editing');
}

/* ---------- Menu contextuel ---------- */

let closeCtxMenu = null;

/** items : [{label, onClick}] ou '-' pour un séparateur. */
function openContextMenu(x, y, items) {
  closeCtxMenu?.();

  const menu = el('div', { class: 'ctx-menu', style: { left: `${x}px`, top: `${y}px` } });
  for (const item of items) {
    if (item === '-') { menu.append(el('div', { class: 'ctx-sep' })); continue; }
    menu.append(el('button', {
      class: 'ctx-item', type: 'button', text: item.label,
      onclick: () => { close(); item.onClick(); },
    }));
  }
  document.body.append(menu);

  requestAnimationFrame(() => {
    const r = menu.getBoundingClientRect();
    if (r.right > window.innerWidth) menu.style.left = `${Math.max(4, window.innerWidth - r.width - 8)}px`;
    if (r.bottom > window.innerHeight) menu.style.top = `${Math.max(4, window.innerHeight - r.height - 8)}px`;
  });

  const onDocDown = (e) => { if (!menu.contains(e.target)) close(); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  function close() {
    menu.remove();
    document.removeEventListener('mousedown', onDocDown, true);
    document.removeEventListener('keydown', onKey);
    if (closeCtxMenu === close) closeCtxMenu = null;
  }
  closeCtxMenu = close;
  // Différé : évite que le mousedown du clic droit qui ouvre le menu le referme aussitôt.
  setTimeout(() => {
    document.addEventListener('mousedown', onDocDown, true);
    document.addEventListener('keydown', onKey);
  }, 0);
  return close;
}

/* ==== js/settings.js ==== */
const ACCENTS = ['#e3a008', '#5eead4', '#f97362', '#8b9dff', '#b5cc4a', '#e879bd', '#9aa3af'];
const ENGINES = [
  ['https://www.google.com/search?q=%s', 'Google'],
  ['https://duckduckgo.com/?q=%s', 'DuckDuckGo'],
  ['https://www.bing.com/search?q=%s', 'Bing'],
  ['https://search.brave.com/search?q=%s', 'Brave'],
  ['https://www.perplexity.ai/search?q=%s', 'Perplexity'],
];

/* ============================================================
   Rendu de formulaire piloté par schéma
   ============================================================ */

let folderCache = null;

// L'utilisateur peut créer un dossier dans un autre onglet pendant que la modale est ouverte.
for (const ev of ['onCreated', 'onRemoved', 'onChanged', 'onMoved']) {
  chrome.bookmarks[ev].addListener(() => { folderCache = null; });
}

async function renderFields(fields, values, onChange) {
  const host = el('div');

  const rebuild = async () => {
    clear(host);
    for (const f of fields) {
      if (f.when && !f.when(values)) continue;
      host.append(await renderField(f, values, async (key, val) => {
        values[key] = val;
        await onChange(key, val);
        if (f.gates) rebuild();   // ce champ pilote l'affichage d'autres champs
      }));
    }
  };

  await rebuild();
  return host;
}

async function renderField(f, values, set) {
  const id = `f_${f.key}_${Math.random().toString(36).slice(2, 6)}`;
  const val = values[f.key];

  if (f.type === 'boolean') {
    const input = el('input', { type: 'checkbox', id, checked: !!val });
    input.addEventListener('change', () => set(f.key, input.checked));
    return el('div', { class: 'field field-inline' }, [
      el('label', { for: id, text: f.label }), input,
    ]);
  }

  if (f.type === 'folderList') {
    folderCache ??= await listFolders();
    const tabs = Array.isArray(val) ? val : (values[f.key] = []);
    const list = el('div', { class: 'tablist-editor' });

    const folderOptions = (selected) => {
      const sel = el('select');
      sel.append(el('option', { value: '', text: '— choisir un dossier —' }));
      for (const folder of folderCache) {
        sel.append(el('option', {
          value: folder.id,
          text: `${'  '.repeat(folder.depth)}${folder.title}`,
          selected: String(folder.id) === String(selected),
        }));
      }
      return sel;
    };

    const redraw = () => {
      clear(list);
      tabs.forEach((tab, i) => {
        const sel = folderOptions(tab.folderId);
        const nameInput = el('input', { type: 'text', placeholder: 'Nom de l\'onglet', value: tab.label || '' });
        sel.addEventListener('change', () => {
          const picked = folderCache.find((x) => x.id === sel.value);
          tabs[i] = { ...tabs[i], folderId: sel.value || null, folderPath: picked?.path || '' };
          set(f.key, tabs);
        });
        nameInput.addEventListener('change', () => {
          tabs[i] = { ...tabs[i], label: nameInput.value };
          set(f.key, tabs);
        });
        const removeBtn = el('button', {
          class: 'btn btn-ghost btn-danger', type: 'button', text: '✕', title: 'Retirer cet onglet',
          onclick: () => { tabs.splice(i, 1); set(f.key, tabs); redraw(); },
        });
        list.append(el('div', { class: 'tablist-row' }, [sel, nameInput, removeBtn]));
      });
      if (!tabs.length) list.append(el('p', { class: 'field-hint', text: 'Aucun onglet. Ajoutes-en un ci-dessous.' }));
    };
    redraw();

    const addBtn = el('button', {
      class: 'btn', type: 'button', text: '+ Ajouter un onglet',
      onclick: () => {
        tabs.push({ id: 't' + Math.random().toString(36).slice(2, 8), label: '', folderId: null, folderPath: '' });
        set(f.key, tabs);
        redraw();
      },
    });

    return el('div', { class: 'field' }, [
      el('label', { text: f.label }), list, addBtn,
      f.hint ? el('p', { class: 'field-hint', text: f.hint }) : null,
    ]);
  }

  let control;

  if (f.type === 'select') {
    control = el('select', { id });
    for (const [v, label] of f.options) {
      control.append(el('option', { value: v, text: label, selected: String(v) === String(val) }));
    }
    control.addEventListener('change', () => set(f.key, control.value));
  } else if (f.type === 'folder') {
    folderCache ??= await listFolders();
    control = el('select', { id });
    control.append(el('option', { value: '', text: '— choisir un dossier —' }));
    for (const folder of folderCache) {
      control.append(el('option', {
        value: folder.id,
        text: `${'\u00A0\u00A0'.repeat(folder.depth)}${folder.title}`,
        selected: String(folder.id) === String(val),
      }));
    }
    control.addEventListener('change', async () => {
      const picked = folderCache.find((x) => x.id === control.value);
      values.folderPath = picked?.path || '';
      await set('folderPath', values.folderPath);
      await set(f.key, control.value || null);
    });
  } else if (f.type === 'range') {
    const out = el('span', { class: 'tb-val', text: String(val) });
    control = el('input', {
      type: 'range', id, min: f.min, max: f.max, step: f.step || 1, value: val,
    });
    control.addEventListener('input', () => { out.textContent = control.value; });
    control.addEventListener('change', () => set(f.key, +control.value));
    return el('div', { class: 'field' }, [
      el('label', { for: id }, [f.label, ' ', out]),
      control,
      f.hint ? el('p', { class: 'field-hint', text: f.hint }) : null,
    ]);
  } else if (f.type === 'datetime') {
    control = el('input', { type: 'datetime-local', id, value: val || '' });
    control.addEventListener('change', () => set(f.key, control.value));
  } else if (f.type === 'number') {
    control = el('input', { type: 'number', id, min: f.min, max: f.max, value: val ?? 0 });
    control.addEventListener('change', () => set(f.key, clamp(+control.value || 0, f.min ?? 0, f.max ?? 9999)));
  } else if (f.type === 'color') {
    control = el('input', { type: 'color', id, value: val || '#000000' });
    control.addEventListener('change', () => set(f.key, control.value));
  } else {
    control = el('input', { type: 'text', id, value: val ?? '' });
    control.addEventListener('change', () => set(f.key, control.value));
  }

  return el('div', { class: 'field' }, [
    el('label', { for: id, text: f.label }),
    control,
    f.hint ? el('p', { class: 'field-hint', text: f.hint }) : null,
  ]);
}

/* ============================================================

async function openWidgetSettings(widgetId) {
  const widget = store.widget(widgetId);
  const def = getWidget(widget?.type);
  if (!widget || !def) return;

  const values = { ...def.defaults, ...widget.settings };
  const body = el('div');

  body.append(await renderFields(def.fields, values, async () => {
    await store.patchSettings(widget.id, values);
  }));

  body.append(el('p', { class: 'section-label', text: 'Couleur' }));
  const colorBox = el('div');
  const colorToggle = el('input', { type: 'checkbox', checked: !!widget.color });

  const renderColorBox = () => {
    clear(colorBox);
    if (!colorToggle.checked) return;
    const swatches = el('div', { class: 'swatches' });
    const custom = el('input', { type: 'color', value: widget.color || '#e3a008' });
    const paint = (hex) => {
      widget.color = hex;
      custom.value = hex;
      [...swatches.children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.hex === hex)));
      store.patchWidget(widget.id, { color: hex });
    };
    for (const hex of ACCENTS) {
      swatches.append(el('button', {
        class: 'swatch', type: 'button', 'data-hex': hex, 'aria-label': hex,
        'aria-pressed': String(widget.color === hex),
        style: { background: hex }, onclick: () => paint(hex),
      }));
    }
    custom.addEventListener('change', () => paint(custom.value));
    swatches.append(custom);
    colorBox.append(el('div', { class: 'field' }, [
      el('label', { text: 'Couleur du module' }), swatches,
      el('p', { class: 'field-hint', text: 'La bordure et le fond du module reprennent cette teinte, dans le même style qu\'aujourd\'hui.' }),
    ]));
  };

  colorToggle.addEventListener('change', async () => {
    widget.color = colorToggle.checked ? (widget.color || '#e3a008') : null;
    await store.patchWidget(widget.id, { color: widget.color });
    renderColorBox();
  });

  body.append(el('div', { class: 'field field-inline' }, [
    el('label', { text: 'Couleur personnalisée pour ce module' }), colorToggle,
  ]));
  body.append(colorBox);
  renderColorBox();

  body.append(el('p', { class: 'section-label', text: 'Dimensions' }));
  const dims = el('div', { class: 'field-row' });
  dims.append(
    numberField('Largeur (colonnes)', widget.w, 1, store.data.layout.cols, (v) =>
      store.patchWidget(widget.id, { w: v })),
    numberField('Hauteur (rangées)', widget.h, 1, 6, (v) =>
      store.patchWidget(widget.id, { h: v })),
  );
  body.append(dims);

  const footer = el('div', { style: { display: 'flex', gap: '8px', width: '100%' } }, [
    el('button', {
      class: 'btn btn-danger', type: 'button', text: 'Supprimer le module',
      onclick: async () => {
        // Libère d'abord les favoris classés virtuellement dans ce module
        // (et ses onglets, le cas échéant) — sinon ils deviendraient
        // invisibles partout dans Atelier, sans plus aucune UI pour les
        // retrouver (ils restent, eux, intacts dans les vrais favoris Chrome).
        await releaseVirtualFolder(`atelier:${widget.id}`);
        await store.removeWidget(widget.id);
        close();
        toast('Module supprimé');
      },
    }),
    el('span', { style: { flex: '1' } }),
    el('button', { class: 'btn btn-primary', type: 'button', text: 'Fermer', onclick: () => close() }),
  ]);

  const close = openModal({ title: def.name, body, footer });
}

function numberField(label, value, min, max, onSet) {
  const input = el('input', { type: 'number', min, max, value });
  input.addEventListener('change', () => {
    const v = clamp(+input.value || min, min, max);
    input.value = v;
    onSet(v);
  });
  return el('div', { class: 'field' }, [el('label', { text: label }), input]);
}

function openAddBoard() {
  const input = el('input', { type: 'text', placeholder: 'Ex. Streaming' });
  const body = el('div', { class: 'field' }, [
    el('label', { text: 'Nom du nouvel onglet' }), input,
  ]);
  const create = async () => {
    await store.addBoard(input.value);
    close();
  };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') create(); });
  const footer = el('div', { style: { display: 'flex', justifyContent: 'flex-end', width: '100%' } }, [
    el('button', { class: 'btn btn-primary', type: 'button', text: 'Créer', onclick: create }),
  ]);
  const close = openModal({ title: 'Nouvel onglet', body, footer });
}

async function openBoardSettings(boardId) {
  const board = store.data.boards.find((b) => b.id === boardId);
  if (!board) return;

  const body = el('div');

  const nameInput = el('input', { type: 'text', value: board.name });
  nameInput.addEventListener('change', () => store.renameBoard(board.id, nameInput.value));
  body.append(el('div', { class: 'field' }, [el('label', { text: 'Nom de l\'onglet' }), nameInput]));

  body.append(el('p', { class: 'section-label', text: 'Thème de cet onglet' }));
  const themeBox = el('div');
  const toggle = el('input', { type: 'checkbox', checked: !!board.theme });

  const renderThemeFields = async () => {
    clear(themeBox);
    if (!toggle.checked) return;
    const values = {
      mode: board.theme?.mode || store.data.theme.mode,
      accent: board.theme?.accent || store.data.theme.accent,
    };
    const commit = () => store.setBoardTheme(board.id, { ...values });

    themeBox.append(await renderFields([
      { key: 'mode', label: 'Thème', type: 'select', options: [['dark', 'Encre'], ['light', 'Papier']] },
    ], values, commit));

    const swatches = el('div', { class: 'swatches' });
    const custom = el('input', { type: 'color', value: values.accent });
    const paint = (hex) => {
      values.accent = hex;
      custom.value = hex;
      [...swatches.children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.hex === hex)));
      commit();
    };
    for (const hex of ACCENTS) {
      swatches.append(el('button', {
        class: 'swatch', type: 'button', 'data-hex': hex, 'aria-label': hex,
        'aria-pressed': String(values.accent === hex),
        style: { background: hex }, onclick: () => paint(hex),
      }));
    }
    custom.addEventListener('change', () => paint(custom.value));
    swatches.append(custom);
    themeBox.append(el('div', { class: 'field' }, [el('label', { text: 'Accent' }), swatches]));
  };

  toggle.addEventListener('change', async () => {
    board.theme = toggle.checked ? { mode: store.data.theme.mode, accent: store.data.theme.accent } : null;
    await store.setBoardTheme(board.id, board.theme);
    renderThemeFields();
  });

  body.append(el('div', { class: 'field field-inline' }, [
    el('label', { text: 'Thème personnalisé (sinon, thème global)' }), toggle,
  ]));
  body.append(themeBox);
  await renderThemeFields();

  const footer = el('div', { style: { display: 'flex', gap: '8px', width: '100%' } }, [
    store.data.boards.length > 1 ? el('button', {
      class: 'btn btn-danger', type: 'button', text: 'Supprimer l\'onglet',
      onclick: async () => {
        if (confirm(`Supprimer l'onglet « ${board.name} » et ses modules ?`)) {
          await store.removeBoard(board.id);
          close();
          toast('Onglet supprimé');
        }
      },
    }) : null,
    el('span', { style: { flex: '1' } }),
    el('button', { class: 'btn btn-primary', type: 'button', text: 'Fermer', onclick: () => close() }),
  ]);

  const close = openModal({ title: 'Réglages de l\'onglet', body, footer });
}

function openAddWidget() {
  const body = el('div');
  for (const [, label, defs] of groupedVisibleWidgets()) {
    body.append(el('p', { class: 'section-label', text: label }));
    const grid = el('div', { class: 'picker' });
    for (const def of defs) {
      grid.append(el('button', {
        type: 'button',
        onclick: async () => {
          const w = makeWidget(def.type, { ...def.defaults }, def.defaultSize);
          await store.addWidget(w);
          close();
          if (def.fields.length) openWidgetSettings(w.id);
        },
      }, [
        el('strong', { text: def.name }),
        el('small', { text: def.blurb }),
      ]));
    }
    body.append(grid);
  }
  const close = openModal({ title: 'Ajouter un module', body });
}
